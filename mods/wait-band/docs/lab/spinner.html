<script type="module">
/* ================= ② 题目（只写这一段；写法见 dc SKILL.md ④） =================
   这里故意是空的：样本、样式、档都由你按题目现写，别从别的对照页抄内容。没填就会在舞台上报错。
   这一段是自己的模块作用域，名字随便起，不会和台子撞。台子给的全局：
     ICON            图标表（台子自用几枚）；样本要用的从项目图标注册表抽出来补：Object.assign(ICON, { 名: "<path …/>" })，不手画
     ic(名, 尺寸)     画一枚图标
     pa(id, 名)       零件命名属性（可选，跨档同名 / ⌥ 抓整组用）：<button ${pa("send", "发送")}>
     part(id, 名, html, cls?)  给一组外面套一层具名壳 */
const TOPIC = "wait-band 转圈符号";
const KEY = "lab.spinner.";

/* 终端底：跟明暗走（token）；claude 橙是 Claude Code 主题色，终端里就是这个色 */
const CSS = `
.term { --claude: #d77757; --dim: var(--ink-3, #8a8a8f);
  font: var(--p-font, 14px)/1.55 "SF Mono", Menlo, monospace; color: var(--ink);
  background: var(--bg-content); border: 1px solid var(--sep-strong); border-radius: 10px;
  padding: 12px 14px 10px; width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; }
.band { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 2ch; row-gap: 2px; }
.cell { display: flex; align-items: baseline; min-width: 0; white-space: pre; }
.g { color: var(--claude); }
.g.err { color: var(--crit); } .g.quiet { color: var(--warn); }
.g.fixed { color: var(--crit); } .g.park { color: var(--warn); } .g.ok { color: var(--ok); }
.t { overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; padding: 0 1ch; }
.r { flex: none; } .r .track { color: color-mix(in srgb, var(--ink) 16%, transparent); } .r .red { color: var(--crit); } .r .grn { color: var(--ok); } .r .mute { color: var(--dim); }
.prompt { border-top: 1px solid var(--sep-strong); margin-top: auto; padding-top: 6px; color: var(--dim); }
`;

/* 每格怎么画：照插件 grid()——符号 · 标题（放不下截）· 右对齐的时间 / 进度条 / 原因。只有「在跑」的符号各档不同 */
const BAR = 8;
const barBlock = (pct) => { const e = Math.round(pct / 100 * BAR * 8); const d = "█".repeat(Math.floor(e / 8)) + (e % 8 ? "▏▎▍▌▋▊▉"[e % 8 - 1] : "");
  return `<span class="grn">${d}</span><span class="mute">${"░".repeat(BAR - [...d].length)}</span><span class="grn"> ${pct}%</span>`; };
// 细线条（R3 起）：走过的是绿色粗线 ━（半格 ╸），没走的是同形暗线——比 █░ 安静
const barLine = (pct) => { const h = Math.round(pct / 100 * BAR * 2); const d = "━".repeat(Math.floor(h / 2)) + (h % 2 ? "╸" : "");
  return `<span class="grn">${d}</span><span class="track">${"━".repeat(BAR - [...d].length)}</span><span class="grn"> ${pct}%</span>`; };
const tail = (w, bar) => w.kind === "pct" ? bar(w.pct)
  : w.kind === "stuck" ? `<span class="red">静 ${w.quiet}s，卡住</span>`
  : w.kind === "loop" ? `<span class="red">同一报错 ×${w.n}，在循环</span>`
  : w.kind === "err" ? `<span class="red">${w.n} 处报错</span>`
  : w.kind === "ok" ? `<span class="grn">完成</span>`
  : w.kind === "fail" ? `<span class="red">退出 1</span>`
  : w.kind === "park" ? `<span class="mute">${w.time}</span>`
  : `${w.time}<span class="mute">/∞</span>`;
const STATIC = { stuck: ["■", "fixed"], loop: ["⟳", "fixed"], park: ["!", "park"], ok: ["✓", "ok"], fail: ["✗", "fixed"] };
/* 档给三样：spin(w, i) 画「在跑」的符号；title(w, i) 可改标题的画法（流光那档用）；st 换整套静态符号（R2 比的就是它） */
const band = (spec, spin, title = (w) => w.title, st = STATIC, bar = barBlock) => `
  <div class="term"><div class="band">${spec.items.map((w, i) => {
    const k = st[w.kind];
    const g = k ? `<span class="g ${k[1]}">${k[0]}</span>` : spin(w, i);
    return `<div class="cell">${g}<span class="t">${title(w, i)}</span><span class="r">${tail(w, bar)}</span></div>`;
  }).join("")}</div><div class="prompt">&gt;&nbsp;</div></div>`;

/* 帧动画：content 逐帧换（steps），时长 = 帧数 ÷ 帧率；每条错开一点相位，像各自的 elapsed */
const frames = (name, list) => `@keyframes ${name} { ${list.map((f, i) => `${(i * 100 / list.length).toFixed(3)}% { content: "${f}"; }`).join(" ")} }
  .${name}::before { content: "${list[0]}"; animation: ${name} calc(${list.length} / var(--fps, var(--p-fps)) * 1s) steps(1, end) infinite; animation-delay: var(--d, 0s); }`;
/* 九格：盲文一字 2 列 × 4 行点，两字并排取前字两列 + 后字一列、上三行 = 3×3。lit(x, y) 决定哪几点亮 */
const BIT = [[0x01, 0x02, 0x04], [0x08, 0x10, 0x20]];   // [列][行] → 盲文点位
const nine = (lit) => { let a = 0, b = 0;
  for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) if (lit(x, y)) { if (x < 2) a |= BIT[x][y]; else b |= BIT[0][y]; }
  return String.fromCodePoint(0x2800 + a) + String.fromCodePoint(0x2800 + b); };
const RING = [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2], [1, 2], [0, 2], [0, 1]];   // 外圈顺时针 8 点
const at = (k) => RING[(k + 8) % 8];
const NINE_GAP = RING.map((_, k) => nine((x, y) => !(x === at(k)[0] && y === at(k)[1])));          // 九点亮、缺口绕圈
const NINE_SNAKE = RING.map((_, k) => nine((x, y) => [0, 1, 2].some((d) => x === at(k - d)[0] && y === at(k - d)[1])));   // 三点连着绕圈
const SEXT = (v) => v === 0 ? " " : v === 21 ? "▌" : v === 42 ? "▐" : v === 63 ? "█" : String.fromCodePoint(0x1FB00 + v - 1 - (v > 21) - (v > 42));
const nineBig = (lit) => { let a = 0, b = 0;
  for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) if (lit(x, y)) { if (x < 2) a |= 1 << (y * 2 + x); else b |= 1 << (y * 2); }
  return SEXT(a) + SEXT(b); };
const BIG_GAP = RING.map((_, k) => nineBig((x, y) => !(x === at(k)[0] && y === at(k)[1])));
const BIG_SNAKE = RING.map((_, k) => nineBig((x, y) => [0, 1, 2].some((d) => x === at(k - d)[0] && y === at(k - d)[1])));
const NINE_FULL = nine(() => true), NINE_X = nine((x, y) => x !== 1 ? y !== 1 : y === 1), NINE_RING = nine((x, y) => !(x === 1 && y === 1));
// 3×3 方块格：外圈 8 块按顺时针编号 --k，中心块常亮（缺口版）或常暗（贪吃蛇版）
const big9 = (kind, { rev = false, phase = 0, cls = "" } = {}) => `<span class="big9 ${kind} ${cls}">${[0, 1, 2].flatMap((y) => [0, 1, 2].map((x) => {
  const k = RING.findIndex(([a, b]) => a === x && b === y);
  return k < 0 ? `<i style="${kind === "snake" ? "opacity:.1" : ""}"></i>` : `<i class="ring" style="--k:${((rev ? 8 - k : k) + phase) % 8}"></i>`; })).join("")}</span>`;
/* 大九格的样式：终端（Ghostty 等）把六分块画满整格高，3×3 正好居中；浏览器没这字形，这里用 3×3 小块照样画 */
const BIG9_CSS = `.big9 { display: inline-grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); width: 1.5ch; height: 1.1em; margin-right: .5ch; vertical-align: -0.17em; color: var(--claude); }
  .big9 i { background: currentColor; }
  .big9.gap i.ring { animation: hole calc(8 / var(--p-fps) * 1s) steps(1, end) infinite; animation-delay: calc((var(--k) - 8) / var(--p-fps) * 1s); }
  .big9.snake i { opacity: .1; } .big9.snake i.ring { animation: snake calc(8 / var(--p-fps) * 1s) steps(1, end) infinite; animation-delay: calc((var(--k) - 8) / var(--p-fps) * 1s); }
  .big9.red { color: var(--crit); } .big9.err { color: var(--crit); }
  @keyframes hole { 0% { opacity: .1; } 12.5%, 100% { opacity: 1; } }
  @keyframes snake { 0% { opacity: 1; } 37.5%, 100% { opacity: .1; } }`;
/* 盲文 4×4：两字并排 = 4 列 × 4 行点，正方形、四行全用所以上下居中。外圈 12 点顺时针 */
const B4 = [[0x01, 0x02, 0x04, 0x40], [0x08, 0x10, 0x20, 0x80]];   // [字内列][行]
const four = (lit) => { let a = 0, b = 0;
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if (lit(x, y)) { if (x < 2) a |= B4[x][y]; else b |= B4[x - 2][y]; }
  return String.fromCodePoint(0x2800 + a) + String.fromCodePoint(0x2800 + b); };
const RING4 = [[0, 0], [1, 0], [2, 0], [3, 0], [3, 1], [3, 2], [3, 3], [2, 3], [1, 3], [0, 3], [0, 2], [0, 1]];
const at4 = (k) => RING4[(k + 12) % 12];
const FOUR_GAP = RING4.map((_, k) => four((x, y) => !(x === at4(k)[0] && y === at4(k)[1])));
const FOUR_SNAKE = RING4.map((_, k) => four((x, y) => [0, 1, 2, 3].some((d) => x === at4(k - d)[0] && y === at4(k - d)[1])));
const FOUR_RING = RING4.map((_, k) => four((x, y) => RING4.some(([a, b]) => a === x && b === y) && !(x === at4(k)[0] && y === at4(k)[1])));
/* 分隔六分块（Unicode 16，U+1CE51 起，按点位位掩码排）：一字 2 列 × 3 行带间隙的小方点，两字 = 居中的 3×3 点阵 */
const SEP6 = (v) => v === 0 ? " " : String.fromCodePoint(0x1CE50 + v);
const nineSep = (lit) => { let a = 0, b = 0;
  for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) if (lit(x, y)) { if (x < 2) a |= 1 << (y * 2 + x); else b |= 1 << (y * 2); }
  return SEP6(a) + SEP6(b); };
const tone = (w) => w.kind === "err" ? "err" : w.kind === "quiet" ? "quiet" : "";
const spinBy = (cls) => (w, i) => `<span class="g ${cls} ${tone(w)}" style="--d:-${(i * 0.37).toFixed(2)}s"></span>`;

const PAGES = [{
  name: "状态条转圈",
  specs: [
    { from: "日常三条", note: "编译报进度，跑测试一直出字，起服务不出声（-q 0）",
      items: [{ title: "编译", kind: "pct", pct: 62 }, { title: "跑测试", kind: "run", time: "34s" }, { title: "起服务", kind: "run", time: "12s", silent: true }] },
    { from: "出事了", note: "卡住 ■、报错循环 ⟳、带报错还在跑（红转圈），旁边还有一条正常的",
      items: [{ title: "跑测试", kind: "run", time: "48s" }, { title: "起服务", kind: "stuck", quiet: 75 }, { title: "连库", kind: "loop", n: 5 },
              { title: "出包", kind: "err", n: 1 }, { title: "静着的测试", kind: "quiet", time: "41s" }] },
    { from: "挂着等你", note: "五条折两行，最后一格是 -p 等标注",
      items: [{ title: "编译", kind: "pct", pct: 30 }, { title: "下载模型", kind: "pct", pct: 81 }, { title: "跑全部单元测试和集成测试再出覆盖率报告", kind: "run", time: "64s" },
              { title: "起服务", kind: "run", time: "9s", silent: true }, { title: "等标注", kind: "park", time: "720s" }] },
    { from: "刚跑完一条", note: "✓ 留 8 秒时，旁边的还在转",
      items: [{ title: "编译", kind: "ok" }, { title: "跑测试", kind: "run", time: "64s" }, { title: "下载模型", kind: "pct", pct: 97 },
              { title: "出包", kind: "fail" }, { title: "等标注", kind: "park", time: "180s" }] },
  ],
  rounds: [{
    name: "R1 转圈形态",
    tile: { w: 880, h: 110 },
    params: [
      { key: "fps", label: "帧率（帧/秒）", min: 1, max: 12, step: 1, tick: 1, def: 4, unit: "" },
      { key: "font", label: "终端字号", min: 12, max: 18, step: 1, tick: 1, def: 14, unit: "px" },
    ],

      { name: "现状 · 星标变形", thesis: "Claude 自己的星标，换形当转圈",
        parts: [["帧", "· ✢ ✳ ✶ ✻ ✽"], ["速度", "1 帧/秒（跟轮询）"], ["宽度", "不等宽"]],
        cost: "✳ 按 2 格排、其余 1 格：转到它标题就右挪一格；1 帧/秒看着卡",
        // ✳ 能显示成 emoji，Claude Code 排版按 2 格算、其余 1 格：转到它那一帧标题右挪一格——这里照这个算法画
        css: frames("s0", ["·", "✢", "✳ ", "✶", "✻", "✽", "✻", "✶", "✳ ", "✢"]) + `.s0 { --fps: 1; }`,
        render: (spec) => band(spec, spinBy("s0")) },

        css: frames("s1", ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"]),
        render: (spec) => band(spec, spinBy("s1")) },

              @keyframes s2 { from { color: var(--claude); } to { color: color-mix(in srgb, var(--claude) 35%, transparent); } }

        flower("✻", "✻ 六瓣星花（R1 选的那朵）", "R1 那朵：六瓣、笔画实", "笔画细的字体里偏小"),
        flower("✽", "✽ 重瓣星花", "瓣更多更满，远看是一团", "小字号时糊成一点"),
        flower("✿", "✿ 实心小花", "五瓣圆花，最像「花」", "偏可爱，和终端里别的符号气质不一样"),
        flower("❀", "❀ 空心小花", "五瓣空心花，比实心轻", "空心在小字号下发虚"),
        flower("✢", "✢ 四瓣十字花", "最简，十字形", "像个加号，和「花」关系弱"),
      ];
    })(),
  }, {
    name: "R7 ✻ 怎么呼吸",
    tile: { w: 880, h: 110 },
    params: [
      { key: "speed", label: "快慢（倍）", min: 0.5, max: 2, step: 0.25, tick: 0.5, def: 1, unit: "" },
      { key: "font", label: "终端字号", min: 11, max: 20, step: 1, tick: 1, def: 15, unit: "px" },
    ],
    css: `.g { display: inline-block; width: 1ch; text-align: center; }

      .m.err { --c: var(--crit); } .m.quiet { --c: var(--warn); }
      @keyframes two { from { color: var(--c); } to { color: color-mix(in srgb, var(--c) 35%, transparent); } }
      @keyframes fade { from { color: var(--c); } to { color: color-mix(in srgb, var(--c) 28%, transparent); } }
      @keyframes four { 0% { color: var(--c); } 25% { color: color-mix(in srgb, var(--c) 72%, transparent); } 50% { color: color-mix(in srgb, var(--c) 48%, transparent); } 75%, 100% { color: color-mix(in srgb, var(--c) 30%, transparent); } }
      @keyframes beat { 0%, 12% { color: var(--c); } 13%, 24% { color: color-mix(in srgb, var(--c) 35%, transparent); } 25%, 37% { color: var(--c); } 38%, 100% { color: color-mix(in srgb, var(--c) 35%, transparent); } }
      .m-r1 { --dur: .5; animation-name: two; animation-timing-function: steps(2, jump-none); animation-direction: alternate; }
      .m-slow { --dur: 1; animation-name: two; animation-timing-function: steps(2, jump-none); animation-direction: alternate; }
      .m-four { --dur: 1; animation-name: four; animation-timing-function: steps(1, end); animation-direction: alternate; }
      .m-fade { --dur: 2; animation-name: fade; animation-timing-function: steps(8, jump-none); animation-direction: alternate; }
      .m-beat { --dur: 1.4; animation-name: beat; animation-timing-function: steps(1, end); }`,
    list: (() => {
      const st = { ok: ["✓", "ok"], fail: ["✗", "fixed"], stuck: ["!", "fixed"], loop: ["!", "fixed"], park: ["!", "park"] };
      const m = (cls, name, thesis, parts, cost) => ({ name, thesis, parts, cost,
        render: (spec) => band(spec, (w, i) => `<span class="g m ${cls} ${tone(w)}" style="--d:-${(i * 0.37).toFixed(2)}s">✻</span>`, undefined, st, barLine) });
      return [
        m("m-r1", "照 R1：两态快闪", "R1 那朵原样：亮 ↔ 35% 两态，0.5 秒一个来回", [["态", "2"], ["周期", "0.5s"], ["暗到", "35%"]],
          "终端里要每秒画 4 次；几条一起闪时有点躁"),
        m("m-slow", "两态 · 慢一倍", "同样两态，1 秒一个来回，更沉稳", [["态", "2"], ["周期", "1s"], ["暗到", "35%"]],
          "没那么「活」；终端每秒画 2 次就够"),
        m("m-four", "四级台阶", "亮 → 72 → 48 → 30 再回来，一级一级退，比两态柔", [["态", "4"], ["周期", "1s 往返"], ["暗到", "30%"]],
          "每秒要画 8 次左右；台阶在小字号下看不出差别"),
        m("m-beat", "心跳", "快闪两下、停一会儿，像心跳——「还活着」", [["节奏", "闪闪 · 停"], ["周期", "1.4s"]],
          "节奏感强，多条一起时显得乱"),
        m("m-fade", "R6 的慢渐变", "对照：2 秒八级慢渐变（你说不如 R1 的那版）", [["态", "8"], ["周期", "2s"], ["暗到", "28%"]],
          "拖、发虚——你已经否了，留着对照"),
      ];
    })(),
  }],
}];

labStart({ TOPIC, KEY, CSS, PAGES });
