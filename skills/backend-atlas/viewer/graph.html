<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>系统图</title>
<!--
  干什么：backend-atlas 的系统图。默认只看业务域（每个域一种颜色），线只留跨域主干；卡一层层展开到功能 / 端点 / 表。
         重点是「体检」：跨域直调、控制器直连外部的线着警示色，连共享层的线画淡；头部 / 浮岛的体检逐项点亮。
         点一张卡 = 聚焦：画布只亮它那一串，右缘长出液态主抽屉讲它；点主抽屉里的一行 = 从那一行鼓出二级抽屉，
         二级抽屉里再点就地换内容、「‹」退回。再点同一张卡 / 同一行、点 ×、点空白或 Esc 收起。
         悬停一张卡 = 画布聚焦预览（只亮它那一跳，移开恢复），不弹抽屉。
         二级抽屉挑一条业务循环时，画布按顺序点亮它走过的路。
  怎么跑：viewer/build.ts 把 token、语义层与抽取数据内联进来生成成品 HTML，直接双击打开。
         拖空白平移 · ⌘滚轮 / 捏合缩放 · 双击或「展开」一层层打开 · ⇧1 看全部 · ⌘F 找 · T 明暗 · Esc 解钉。
         经 serve.ts 打开（http）时可编辑：双击空白新建节点，抽屉里连线 / 删除，全部读写 intent.json，agent 改文件画布 1 秒内跟上。
  需要什么：由 build.ts 注入 token 与数据两处占位，模板本身不能单独打开。
         液态抽屉：一滩液体随弹簧长出 / 收回，主抽屉与延伸抽屉之间由一截「颈」相连。
-->
<style>
/*__TOKENS__*/
</style>
<style>
/* ---- 语义色板：一个业务域一种颜色（参考卡片日历的实色卡），卡上的字恒为深墨 ---- */
:root {
  --paper: var(--bg-window);
  --h-blue: #8fb4ff; --h-green: #86d9a8; --h-yellow: #f1dd78; --h-pink: #f5a0bd;
  --h-orange: #f6b66e; --h-purple: #c2a6f6; --h-teal: #86d3d6; --h-gray: #b8bbc3;
  --on-hue: #17171b;   /* 实色卡上的字：深墨，不用纯黑 */
  --drop: 0 6px 16px color-mix(in srgb, #000 34%, transparent);   /* 抽屉投影：暗色 */
  --rim: 0 0 0 1px color-mix(in srgb, #fff 5%, transparent);      /* 液体外沿：暗色 5% */
  /* 线的色族（取卡片色板，与卡和谐）：请求类 蓝 · 推送类 粉 · 写表 绿（同 PostgreSQL 卡）· 出站 橙；调用 / 读 中性 */
  --l-req: var(--h-blue); --l-push: var(--h-pink); --l-write: var(--h-green); --l-http: var(--h-orange);
}
[data-theme="light"] { --l-req: #3d6fd6; --l-push: #c94f7c; --l-write: #2e9a5f; --l-http: #c5741c; --drop: 0 6px 16px color-mix(in srgb, #000 13%, transparent); --rim: 0 0 0 1px var(--hairline); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font); color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
a { color: inherit; text-decoration: none; }
input { -webkit-user-select: text; user-select: text; cursor: text; }
.ic { flex: none; display: block; }
.sel-text { -webkit-user-select: text; user-select: text; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ───── 画布 ───── */
.bd { position: fixed; inset: 0; overflow: hidden; touch-action: none; outline: none; background: var(--paper); }
.bd.is-panning { cursor: grabbing; }
.bd-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.bd-links { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
/* 展开 / 收起的形变：卡、框走 transform，线走 d；时长与脚本里 MORPH 一致 */
:root { --morph: 280ms; }
.eg { transition: opacity var(--t-med) var(--ease-out); }
.eg .ln { transition: d var(--morph) var(--ease-in-out), opacity var(--t-fast) var(--ease-out), stroke var(--t-fast) var(--ease-hover); }
.eg .pin { transition: cx var(--morph) var(--ease-in-out), cy var(--morph) var(--ease-in-out), opacity var(--t-fast) var(--ease-out); }
.gone { opacity: 0 !important; pointer-events: none; }
/* 线型 = 关系种类（虚实 / 粗细）：调用 虚线 · 请求 / 路由 实线 · 本机调用 / 连接 长虚线 · 推送 圆点串 · 写 粗实线 · 读 短虚线 ·
   出站 点划线 · 广播 细点 · 磁盘 / 缓存 碎虚线。颜色 = 色族（m- 类设 --lc）：线、箭头、起点、流动的点、标签底色同一个色 */
.m-n { --lc: var(--ink-4); } .m-s { --lc: var(--ink-2); } .m-req { --lc: var(--l-req); } .m-push { --lc: var(--l-push); }
.m-write { --lc: var(--l-write); } .m-http { --lc: var(--l-http); } .m-l { --lc: var(--accent); } .m-w { --lc: var(--warn); }
.ln { fill: none; stroke: var(--lc, var(--ink-4)); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 6 5; pointer-events: none; opacity: 0.75; }
.ln.k-request, .ln.k-route { stroke-width: 1.6; stroke-dasharray: none; }
.ln.k-invoke, .ln.k-connect { stroke-width: 1.8; stroke-dasharray: 12 4; }
.ln.k-push, .ln.k-pushes { stroke-width: 2.6; stroke-dasharray: 0.1 6; }
.ln.k-writes, .ln.k-updates { stroke-width: 3; stroke-dasharray: none; }
.ln.k-reads { stroke-width: 1.5; stroke-dasharray: 2 4; }
.ln.k-http { stroke-width: 1.8; stroke-dasharray: 9 4 1 4; }
.ln.k-bus, .ln.k-emits { stroke-width: 2; stroke-dasharray: 0.1 4.5; }
.ln.k-io, .ln.k-cache { stroke-dasharray: 3 3; }
.ln.strong, .ln.loop, .ln.warn { opacity: 1; }
.ln.dim { opacity: 0.08; }
.bd.hard .ln.dim, .bd.hard .pin.dim, .bd.hard .bd-lbl.dim { opacity: 0; }
/* 共享层的线是预期的分层（谁都要用数据层），淡下去；体检命中的线（跨域直调、直连外部）着警示色，是图的重点 */
.ln.base { opacity: 0.28; }
/* 流动的点：聚焦 / 循环时沿调用方向走，看得出谁调谁；只在聚焦时动 */
.bead { fill: none; stroke: var(--lc, var(--ink)); stroke-width: 4.4; stroke-linecap: round; stroke-dasharray: 0.1 26; opacity: 0; pointer-events: none; transition: d var(--morph) var(--ease-in-out), opacity var(--t-fast) var(--ease-out); }
.eg.flow .bead { opacity: 1; animation: flow 1.2s linear infinite; }
.eg.flow.m-l .bead { animation-duration: 0.9s; }
.eg.flow.m-s .bead { --lc: var(--ink); }
@keyframes flow { from { stroke-dashoffset: 26.1; } to { stroke-dashoffset: 0; } }
.pin { fill: var(--lc, var(--ink-3)); }
.pin.dim { opacity: 0.08; }
.ah { fill: none; stroke: var(--lc, var(--ink-3)); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bd-lbl { position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none; font-size: 12px; font-weight: 650; padding: 3px 9px; border-radius: var(--r-pill); background: var(--panel-hi); color: var(--ink-2); box-shadow: 0 0 0 3px var(--paper); transition: opacity var(--t-fast) var(--ease-out), transform var(--morph) var(--ease-in-out); }
.bd-lbl.loop { background: var(--accent-soft); color: var(--accent-ink); }
.bd-lbl.tint { background: color-mix(in srgb, var(--lc) 24%, var(--panel-hi)); color: var(--ink); }
.bd-lbl.dim { opacity: 0.12; }
.bd-no { position: absolute; left: 0; top: 0; transition: opacity var(--t-fast) var(--ease-out), transform var(--morph) var(--ease-in-out); min-width: 24px; height: 24px; padding: 0 7px; border-radius: var(--r-pill); display: grid; place-items: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--accent); color: var(--on-accent, var(--bg-content)); box-shadow: 0 0 0 3px var(--paper); pointer-events: none; }

/* ───── 卡：实色、深墨；左上图标、右上展开，底部一行元信息 + 粗体标题 ───── */
.bd-node { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: opacity var(--t-fast) var(--ease-out), transform var(--morph) var(--ease-in-out); }
.bd-nb { position: relative; height: 100%; padding: 16px 18px 17px; border-radius: 12px; background: color-mix(in srgb, var(--h, var(--h-gray)) var(--mix, 100%), var(--paper)); color: var(--on-hue); display: flex; flex-direction: column; overflow: hidden;
  box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 35%, transparent), 0 1px 2px color-mix(in srgb, #000 24%, transparent), 0 8px 20px color-mix(in srgb, #000 26%, transparent);
  transition: box-shadow var(--t-fast) var(--ease-hover); }
.bd-node:hover .bd-nb { box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 35%, transparent), 0 0 0 2px color-mix(in srgb, #fff 45%, transparent), 0 14px 30px color-mix(in srgb, #000 50%, transparent); }
.lv2 { --mix: 86%; } .lv3 { --mix: 74%; } .lv4 { --mix: 64%; }
.hue-blue { --h: var(--h-blue); } .hue-green { --h: var(--h-green); } .hue-yellow { --h: var(--h-yellow); } .hue-pink { --h: var(--h-pink); }
.hue-orange { --h: var(--h-orange); } .hue-purple { --h: var(--h-purple); } .hue-teal { --h: var(--h-teal); } .hue-gray { --h: var(--h-gray); }
.top { display: flex; align-items: center; gap: 8px; height: 24px; }
.top .ic { color: color-mix(in srgb, var(--on-hue) 72%, transparent); }
.xp { margin-left: auto; height: 24px; padding: 0 4px 0 9px; border-radius: 8px; background: color-mix(in srgb, var(--on-hue) 9%, transparent); display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 650; color: color-mix(in srgb, var(--on-hue) 78%, transparent); font-variant-numeric: tabular-nums; }
.xp:hover { background: color-mix(in srgb, var(--on-hue) 16%, transparent); color: var(--on-hue); }
.xp:active { transform: scale(var(--press)); }
.vb { height: 20px; padding: 0 6px; border-radius: 6px; background: color-mix(in srgb, var(--on-hue) 12%, transparent); font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--on-hue); display: inline-flex; align-items: center; }
.bot { margin-top: auto; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.mt { font-size: 13px; font-weight: 650; color: color-mix(in srgb, var(--on-hue) 60%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mt.m { font-family: var(--font-mono); font-weight: 450; font-size: 12.5px; }
.ttl { font-size: 25px; font-weight: 700; letter-spacing: -0.5px; line-height: 30px; color: var(--on-hue); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.leaf .ttl { font-size: 19px; line-height: 24px; -webkit-line-clamp: 1; }
.res .bd-nb { padding: 0 14px; flex-direction: row; align-items: center; gap: 10px; }
.res .ttl { font-size: 15px; -webkit-line-clamp: 1; }
.res .mt { margin-left: auto; }
.bd-node.focus .bd-nb { box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 35%, transparent), 0 0 0 2.5px color-mix(in srgb, #fff 70%, transparent), 0 14px 30px color-mix(in srgb, #000 50%, transparent); }
.bd-node.pinned .bd-nb { box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 35%, transparent), 0 0 0 3px var(--ink), 0 14px 30px color-mix(in srgb, #000 50%, transparent); }
.bd-node.hot .bd-nb { box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 35%, transparent), 0 0 0 3px var(--accent), 0 14px 30px color-mix(in srgb, #000 50%, transparent); }
.bd-node.dim { opacity: 0.34; filter: saturate(0.3); }

/* 框：泳道框 / 展开后的域框，虚线描边 */
.bd-frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; border-radius: 16px; background: color-mix(in srgb, var(--ink) 2.5%, transparent); border: 1px dashed var(--sep-strong); transition: opacity var(--t-med) var(--ease-out), transform var(--morph) var(--ease-in-out), width var(--morph) var(--ease-in-out), height var(--morph) var(--ease-in-out); }
.bd-frame.lane { background: none; border-radius: 20px; }
.bd-fh { position: absolute; left: 0; right: 0; top: 0; height: 48px; padding: 14px 18px; display: flex; gap: 10px; align-items: center; }
.bd-fh b { font-size: 14px; font-weight: 650; color: var(--ink-2); white-space: nowrap; }
.bd-fh em { font-style: normal; font-size: 12px; color: var(--ink-4); font-weight: 650; white-space: nowrap; }
.bd-fh .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--h, var(--h-gray)); flex: none; }
.bd-frame.lane > .bd-fh { height: 56px; padding: 18px 22px; }
.bd-frame.lane > .bd-fh b { font-size: 18px; color: var(--ink); }
.bd-mbtn { margin-left: auto; height: 26px; padding: 0 10px; border-radius: 9px; font-size: 12px; font-weight: 650; color: var(--ink-3); display: inline-flex; align-items: center; }
.bd-mbtn:hover { background: var(--hover-2); color: var(--ink); }
.bd-mbtn:active { transform: scale(var(--press)); }
.bd.focusing .bd-frame:not(.lane) { opacity: 0.6; }

/* ───── 上层：标题 · 浮岛 · 小地图 ───── */
.hd { position: fixed; left: 24px; top: 18px; z-index: 3; display: flex; flex-direction: column; gap: 8px; pointer-events: none; transition: opacity var(--t-fast) var(--ease-out), transform var(--t-med) var(--ease-out); }
/* 聚焦（悬停或点中）时左上角让位，不挡被点亮的卡；看体检项时留着，「正在看」芯片在这里 */
body.focused .hd { opacity: 0; transform: translateY(-6px); }
body.focused .hd .row0 { pointer-events: none; }
.hd h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.4px; }
.hd .row0 { display: flex; gap: 6px; align-items: center; pointer-events: auto; }
.chip { height: 24px; padding: 0 9px; border-radius: var(--r-pill); background: var(--hover-2); font-size: 12px; font-weight: 650; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.chip.a { background: var(--accent-soft); color: var(--accent-ink); }
.chip.m { font-family: var(--font-mono); font-weight: 450; }
.chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
button.chip:hover { background: var(--hover); color: var(--ink); }
.chip.w { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.chip.w b { color: var(--warn); }
.chip.z { color: var(--ink-4); }
/* 抽屉开着时浮岛与浮岛抽屉让到剩下的画布正中：--dw-w = 抽屉占的宽 */
.bd-isl { position: fixed; z-index: 6; left: 50%; bottom: 18px; transform: translateX(calc(-50% - var(--dw-w, 0px) / 2)); transition: transform var(--t-med) var(--ease-in-out); display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 16px; background: var(--panel-hi); box-shadow: var(--drop), var(--rim); white-space: nowrap; }
.bd-ib { height: 36px; min-width: 36px; padding: 0 12px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 650; color: var(--ink-2); transition: background var(--t-fast) var(--ease-hover), color var(--t-fast) var(--ease-hover); }
.bd-ib:hover { background: var(--hover); color: var(--ink); }
.bd-ib:active { transform: scale(var(--press)); }
.bd-ib.on { background: var(--hover-2); color: var(--ink); }
.bd-sep { width: 1px; height: 18px; background: var(--sep-strong); margin: 0 4px; flex: none; }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: 12px; background: var(--hover); }
.seg button { height: 32px; padding: 0 12px; border-radius: 10px; font-size: 12.5px; font-weight: 650; color: var(--ink-3); }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-sm); }
.seg button:active { transform: scale(var(--press)); }

/* 浮岛往上弹的抽屉：普通圆角卡，不用液体 */
.pop { position: fixed; z-index: 8; left: 50%; bottom: 72px; width: 420px; max-height: min(520px, calc(100% - 100px)); transform: translate(calc(-50% - var(--dw-w, 0px) / 2), 10px); display: flex; flex-direction: column; overflow: hidden; background: var(--panel-hi); border-radius: 16px; box-shadow: var(--drop), var(--rim);
  opacity: 0; pointer-events: none; transition: opacity var(--t-fast) var(--ease-out), transform var(--t-med) var(--ease-out); }
.pop.in { opacity: 1; pointer-events: auto; transform: translate(calc(-50% - var(--dw-w, 0px) / 2), 0); }

/* ───── 液态抽屉：svg 画整滩液体，面的 DOM 摆在终态、逐帧 clip；影由投影板投 ───── */
.dw { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
.dw > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dw > svg path { fill: var(--panel-hi); }
.plate { position: absolute; left: 0; top: 0; visibility: hidden; box-shadow: var(--drop), var(--rim); }
.pane { position: absolute; top: 16px; bottom: 16px; display: flex; flex-direction: column; overflow: hidden; border-radius: 16px; opacity: 0; }
.pane-m { right: 16px; width: 380px; }
.pane-s { right: calc(16px + 380px + 14px); width: 360px; }
.dw-in { flex: 1; min-height: 0; display: flex; flex-direction: column; }
/* 抽屉开着换内容：新内容上浮 4px 淡入 */
.dw-in > * { transition: opacity var(--t-fast) var(--ease-out), transform var(--t-fast) var(--ease-out); }
.dw-in.swap > * { opacity: 0; transform: translateY(4px); transition: none; }
/* ───── 抽屉里：头 → 一排数 → 分节列表。整行是点击目标，右侧 › 表示「点开往下一层」；数字只做原子，份量交给小条 / 小环 / 色点 ───── */
.ph { flex: none; display: flex; align-items: flex-start; gap: 6px; padding: 16px 14px 10px 18px; }
.ph .tt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.crumb { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12px; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
.crumb > span { overflow: hidden; text-overflow: ellipsis; }
.tile { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--h, var(--h-gray)); color: var(--on-hue); }
.back { height: 24px; padding: 0 8px 0 4px; margin-left: -4px; border-radius: 8px; display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 650; color: var(--ink-2); }
.back:hover { background: var(--hover); color: var(--ink); }
.back .ic { transform: rotate(180deg); }
.ph h3 { margin: 0; font-size: 21px; font-weight: 700; line-height: 1.25; letter-spacing: -0.3px; }
.ph .rt { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.5; color: var(--ink-3); word-break: break-all; }
.px { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-3); }
.px:hover { background: var(--hover); color: var(--ink); }
.px:active, .fr:active, .back:active { transform: scale(var(--press)); }
.pb { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 2px 14px 18px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; }
.pb p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
.pb p.dim { font-size: 12px; color: var(--ink-3); }
.vbg { flex: none; min-width: 54px; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--hover-2); font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; }
.vbg.w { background: var(--accent-soft); color: var(--accent-ink); }
.tag { height: 20px; padding: 0 7px; border-radius: var(--r-pill); background: var(--hover-2); font-size: 11px; font-weight: 650; color: var(--ink-2); display: inline-flex; align-items: center; white-space: nowrap; }
.tag.w { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
/* 一排数：不装框，共用基线；循环带一只「有入口占比」小环 */
.stats { display: flex; gap: 22px; padding: 0 4px; }
.st { display: flex; flex-direction: column; gap: 1px; }
.st b { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; color: var(--ink); font-variant-numeric: tabular-nums; }

<style>

<script>
const D = /*__DATA__*/null;

/* ================= 排版尺寸（改这里整张图跟着变） ================= */
const W_DOM = 264, H_DOM = 156, H_GROUP = 136, W_LEAF = 248, H_EP = 108, H_FILE = 96, H_RES = 60;
const GAP_Y = 22, GAP_X = 110, FR_PAD = 18, FR_HEAD = 50, LANE_PAD = 34, LANE_HEAD = 62, LANE_GAP = 140;   // 泳道间的缝要放得下请求、推送两条主干的标签
const MAX_STACK = 5;    // 一列最多堆几块，超出折成并排子列
const FRAME_ROWS = 4;   // 展开框里一列最多几张卡：多了就并排成网格
const SEP = "\t";       // 边 key 分隔符：节点 id 里带 |，只能用 id 里不会出现的字符
const KIND_NAME = { calls: "调用", reads: "读", writes: "写", pushes: "发推送", push: "推送", request: "请求", route: "路由", invoke: "本机调用", bus: "窗口广播", emits: "广播", http: "出站", io: "磁盘", cache: "缓存", connect: "连接" };
// 线的色族：请求类 / 推送类 / 写 / 出站各一色，其余中性
const FAM = (k) => ({ request: "req", route: "req", invoke: "req", connect: "req", push: "push", pushes: "push", bus: "push", emits: "push", writes: "write", updates: "write", http: "http" })[k] ?? "n";
const PRIORITY = ["push", "pushes", "request", "route", "invoke", "connect", "http", "writes", "reads", "bus", "emits", "io", "cache", "calls"];

/* ================= 索引 ================= */
const byId = new Map(D.nodes.map((n) => [n.id, n]));
const ic = (n, s = 16) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${D.icons[n] ?? ""}</svg>`;
const esc = (s) => String(s ?? "").replace(/\*\*/g, "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const laneOf = (col) => D.lanes.find((l) => l.cols.includes(col));
const vsc = (side, file, line) => file && D.roots?.[side] ? `vscode://file${D.roots[side]}/${file}:${line ?? 1}` : null;   // SHARE=1 出的图不带本机路径，就不给跳转
const routeTail = (r) => r.replace(/\{(\w+)(:\w+)?\}/g, "{$1}");
const ancestors = (id) => { const out = []; for (let n = byId.get(id); n?.parent; n = byId.get(n.parent)) out.unshift(n.parent); return out; };
const domainOf = (id) => { let top = null; for (let n = byId.get(id); n; n = byId.get(n.parent)) if (n.kind === "domain") top = n.id; return top; };
const hueOf = (id) => { for (let n = byId.get(id); n; n = byId.get(n.parent)) if (n.hue) return n.hue; return "gray"; };
const depthOf = (id) => ancestors(id).length;
const PIPE = D.pipeDom, HUB = D.hubDom;   // 认领了 S:pipe / S:hub 的域（build 算好）
const canOpen = (n) => n.kids.length > 1 || n.kids.some((k) => byId.get(k).plan);   // 只有一个子项的展开了也只是把自己再画一遍，不给展开；里面有意图节点时例外，不然它藏在里面看不见
const isDomCard = (n) => n.kind === "domain" || n.kids.length > 0;
const isRes = (n) => !isDomCard(n) && (n.kind === "table" || n.kind === "event");
const HAS_CLIENT = D.nodes.some((n) => n.id.startsWith("C:"));   // 没有客户端腿时，「入口」这件事整个不提
const SHARED = D.shared ?? null;                                   // 共享层（服务与数据访问）：连它的线是预期分层，画淡
const nearDom = (id) => { for (let n = byId.get(id); n; n = byId.get(n.parent)) if (n.kind === "domain") return n.id; return null; };
// 一组路由去掉共同前缀（/api/v1/…），只留能区分彼此的尾巴
const trimmer = (routes) => {
  const segs = routes.map((r) => r.split("/"));
  let k = 0;
  while (segs.length && segs.every((x) => x.length > k + 1 && x[k] === segs[0][k])) k++;
  return (r) => r.split("/").slice(k).join("/") || r;
};
const named = (l) => l.name !== `${l.verbs.join(",")} ${l.route}`;   // 语义层给过人话名

    if (cam) { FCAM.set(camKey(), cam.dataset.cam === "fit" ? fitCam() : { k: 1, x: 16, y: 16 }); return applyCam(); }

    if (!nodeEl || !f) return;
    const s = flowSpec(f), n = s.all.find((x) => x.id === nodeEl.dataset.id);
    if ((e.metaKey || e.ctrlKey) && n?.a) { const [file, line] = n.a.split(":"); location.href = vsc(n.side ?? "S", file, line); return; }
    if (n?.k === "link" && n.flow && D.flows.some((x) => x.id === n.flow)) return openFlow(n.flow);   // 跳到另一条流程（交给后台 / 续跑）

  fp.addEventListener("pointermove", (e) => {
    if (!pan) return;

  fp.addEventListener("wheel", (e) => {
    const map = e.target.closest(".split > .map"), c = FCAM.get(camKey());

/* ================= 抽屉内容 =================
   主抽屉讲点中的卡；主抽屉里点一行 = 从那一行鼓出二级抽屉。二级抽屉里再点一行就地换内容，头部「‹ 上一层」退回。
   S.side = { kind: group | loop | leaf, id, from }，from 是上一层（链的根就是主抽屉里被点的那一行，颈接在它身上） */
const pMin = document.getElementById("pMin"), pSin = document.getElementById("pSin");
const skey = (x) => x ? x.kind + ":" + x.id : null;
const rootOf = (x) => { while (x?.from) x = x.from; return x; };
const chainKey = (x) => { const out = []; for (; x; x = x.from) out.push(skey(x)); return out.join(SEP); };
let mainKey = "", sideKey = "";
function renderPanels() {
  const n = S.sel && byId.get(S.sel);
  const root = skey(rootOf(S.side));
  const mk = n ? [n.id, S.open.has(n.id), G.edges.length].join(SEP) : "";
  if (n && mk !== mainKey) {
    const st = pMin.querySelector(".pb")?.scrollTop ?? 0, same = mainKey.split(SEP)[0] === n.id;
    pMin.innerHTML = mainHtml(n);
    if (same) pMin.querySelector(".pb").scrollTop = st;
    else if (g.v > 0.5) swap(pMin);   // 抽屉开着换了一张卡：新内容淡入，不硬切
  }
  if (n) { mainKey = mk; for (const el of pMin.querySelectorAll("[data-side]")) el.classList.toggle("on", el.dataset.side === root); }
  const sk = chainKey(S.side);
  if (S.side && sk !== sideKey) {

    if (sideKey && gs.v > 0.5) swap(pSin);
  }
  sideKey = S.side ? sk : "";
  liquidTo(!!n, !!S.side);
}
function swap(el) { el.classList.add("swap"); void el.offsetWidth; el.classList.remove("swap"); }

// 头：面包屑（泳道 / 祖先，前面一枚域色小块）或「‹ 上一层」· 标题 · 路由；右上角展开到图上、关闭

// 单张叶子（端点 / 表 / 文件 / 出站）：标签 · 注释 · 读写方 · 源码

// 子项：叶子按内容分节（端点 / 表 / 文件），带子项的列成功能行；混着的（域里几个端点 + 一个「内部实现」组）两样都列，多的在前

// 二级抽屉（一）：一个功能组——一排数 + 按内容分节的叶子（组里还有组时列成功能行）

    + `<div class="pb">${leafBody(c)}${sec("业务循环", ls.length, ls.map(loopRow).join(""))}<button class="act" data-go="${esc(c.id)}">${ic("search", 14)}在图上定位</button></div>`;

    + `<div class="pb">${l.story ? `<div class="insight sel-text">${esc(l.story)}</div>` : ""}${(() => { const f = D.flows.find((x) => x.loop === l.id); return f ? `<button class="fc-main" data-flow="${esc(f.id)}"><span>看它怎么跑</span><i>${f.source === "sem" ? "已整理" : "草稿"} · ${f.size} 个节点</i>${ic("chevRight", 14)}</button>` : ""; })()}${trigSec}
      <section class="sec"><div class="cap">怎么走<em>${steps.length} 步</em></div><div class="path">${path}</div></section>
      <p class="dim">在图上展开卡片，步骤会细到功能、端点和表。</p></div>`;

/* ================= 液态抽屉（几何与弹簧） ================= */
const MAIN_OPEN = [230, 0.55], MAIN_SHUT = [840, 1], SIDE_OPEN = [260, 0.6], SIDE_SHUT = [1040, 1];
const LEAD_K = 420, TRAIL_K = 160, NECK_ZETA = 0.82;   // 颈换位置：领头的边硬、先到，尾边软、后跟
const OVERSHOOT = 1.15, SLIVER = 6, R = 16, NECK_F = 7;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const stepS = (s, t, k, z, dt) => { s.vel += (k * (t - s.v) - 2 * Math.sqrt(k) * z * s.vel) * dt; s.v += s.vel * dt; };

const lerp = (a, b, t) => a + (b - a) * t;
const r2 = (v) => Math.round(v * 100) / 100;
// 圆角矩形，顺时针（与颈同绕向，nonzero 下叠处才是并集，反了会抵消成洞）
function rrect(x, y, w, h, r) {

  return `M${r2(x + r)},${r2(y)} H${r2(x + w - r)} A${r2(r)} ${r2(r)} 0 0 1 ${r2(x + w)},${r2(y + r)} V${r2(y + h - r)} A${r2(r)} ${r2(r)} 0 0 1 ${r2(x + w - r)},${r2(y + h)} H${r2(x + r)} A${r2(r)} ${r2(r)} 0 0 1 ${r2(x)},${r2(y + h - r)} V${r2(y + r)} A${r2(r)} ${r2(r)} 0 0 1 ${r2(x + r)},${r2(y)} Z`;

// 两块面之间的一截颈：两端凹角按墙上还剩多少直边收小；贴近某块的圆角时把那个角垫成直角

  d += fr > 0 ? ` A${r2(fr)} ${r2(fr)} 0 0 0 ${r2(Rw)},${r2(t - fr)}` : ` L${r2(Rw)},${r2(t)}`;
  d += ` V${r2(t + h + fr)}` + (fr > 0 ? ` A${r2(fr)} ${r2(fr)} 0 0 0 ${r2(Rw - fr)},${r2(t + h)}` : "") + ` H${r2(L + fl)}`;
  d += (fl > 0 ? ` A${r2(fl)} ${r2(fl)} 0 0 0 ${r2(L)},${r2(t + h + fl)}` : ` L${r2(L)},${r2(t + h)}`) + " Z";

    let o = "";
    if (t - f < S2.y + CR) o += ` M${r2(x0)},${r2(S2.y)} H${r2(x1)} V${r2(S2.y + CR)} H${r2(x0)} Z`;
    if (t + h + f > S2.y + S2.h - CR) o += ` M${r2(x0)},${r2(S2.y + S2.h - CR)} H${r2(x1)} V${r2(S2.y + S2.h)} H${r2(x0)} Z`;

const soften = (v, end, room) => v <= end || room <= 0 ? Math.min(v, end + Math.max(0, room)) : end + room * Math.tanh((v - end) / room);
const pM = document.getElementById("pM"), pS = document.getElementById("pS"), liq = document.getElementById("liq");
const plM = document.getElementById("plM"), plS = document.getElementById("plS");
const g = spring(0), gs = spring(0), nt = spring(0), nb = spring(0);
let gTo = 0, gsTo = 0, raf = 0, last = 0, neckInit = false;
const boxOf = (el) => { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; };
// 颈接在哪：主抽屉里开出延伸抽屉的那一块（按 data-side 找回来，重渲之后照样找得到）
function span() {
  const Mf = boxOf(pM);
  const blk = S.side && pMin.querySelector(`[data-side="${CSS.escape(skey(rootOf(S.side)))}"]`);
  if (!blk) return { t: Mf.y + 80, h: 60 };
  const r = blk.getBoundingClientRect();
  const t = clamp(r.top, Mf.y + R, Mf.y + Mf.h - R - 40);
  return { t, h: clamp(r.height, 36, Mf.y + Mf.h - R - t) };
}
function fitPane(el, fr, cur, p, content) {
  if (!cur) { el.style.opacity = "0"; el.style.pointerEvents = "none"; return; }
  const r = Math.min(R, cur.w / 2, cur.h / 2);
  const t = Math.max(0, cur.y - fr.y), b = Math.max(0, fr.y + fr.h - (cur.y + cur.h));
  const l = Math.max(0, cur.x - fr.x), rt = Math.max(0, fr.x + fr.w - (cur.x + cur.w));
  el.style.clipPath = `inset(${t}px ${rt}px ${b}px ${l}px round ${r}px)`;
  el.style.opacity = "1";
  el.firstElementChild.style.opacity = String(content);
  el.style.pointerEvents = p > 0.3 ? "auto" : "none";
}
function plate(el, b) {
  if (!b) { el.style.visibility = "hidden"; return; }
  el.style.visibility = "visible";
  el.style.transform = `translate(${b.x}px, ${b.y}px)`;
  el.style.width = `${b.w}px`; el.style.height = `${b.h}px`;
  el.style.borderRadius = `${Math.min(R, b.w / 2, b.h / 2)}px`;
}
function drawLiquid() {
  const Mf = boxOf(pM), Sf = boxOf(pS);
  const p = g.v, q = gs.v;
  let M = null, Sx = null;
  // 主面：卡片墙没有来源（液桥会横穿同排别的卡），满高、从右缘往左长，宽带过冲压进右缘那道缝
  if (p > 0.004) { const w = soften(lerp(SLIVER, Mf.w, clamp(p, 0, OVERSHOOT)), Mf.w, 14); M = { x: Mf.x + Mf.w - w, y: Mf.y, w, h: Mf.h }; }
  // 延伸抽屉：右缘钉在颈那一侧，从颈那么高、6px 宽的一条鼓出来，再满高铺开
  if (M && q > 0.004) {
    const w = lerp(SLIVER, Sf.w, clamp(q, 0, OVERSHOOT)), ec = clamp(q);
    Sx = { x: Sf.x + Sf.w - w, y: lerp(nt.v, Sf.y, ec), w, h: lerp(nb.v - nt.v, Sf.h, ec) };
  }
  let d = M ? rrect(M.x, M.y, M.w, M.h, R) : "";
  if (M && Sx) {
    d += rrect(Sx.x, Sx.y, Sx.w, Sx.h, R);
    d += joint({ a: Sx.x + Sx.w, b: M.x, t: nt.v, h: nb.v - nt.v, A: { y: Sx.y, h: Sx.h, w: Sx.w }, B: { y: M.y, h: M.h, w: M.w }, F: NECK_F, CR: R });
  }
  liq.setAttribute("d", d);
  liq.style.opacity = String(clamp(p * 8));   // 液体几乎一开就在，只在最后一刻淡掉
  fitPane(pM, Mf, M, p, clamp((p - 0.1) / 0.3));
  fitPane(pS, Sf, Sx, q, clamp((q - 0.1) / 0.3));
  plate(plM, M); plate(plS, Sx);
}
function frame(now) {
  raf = 0;
  const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000));
  last = now;
  const sp = span();
  if (!neckInit) { nt.v = sp.t; nb.v = sp.t + sp.h; neckInit = true; }
  const down = sp.t > nt.v;
  stepS(nt, sp.t, down ? TRAIL_K : LEAD_K, NECK_ZETA, dt);
  stepS(nb, sp.t + sp.h, down ? LEAD_K : TRAIL_K, NECK_ZETA, dt);
  stepS(g, gTo, ...(gTo > g.v ? MAIN_OPEN : MAIN_SHUT), dt);
  stepS(gs, gsTo, ...(gsTo > gs.v ? SIDE_OPEN : SIDE_SHUT), dt);
  const busy = !near(g, gTo) || !near(gs, gsTo) || Math.abs(nt.v - sp.t) + Math.abs(nb.v - sp.t - sp.h) > 0.3 || Math.abs(nt.vel) + Math.abs(nb.vel) > 0.3;
  if (busy) raf = requestAnimationFrame(frame);
  else { g.v = gTo; g.vel = 0; gs.v = gsTo; gs.vel = 0; if (!gsTo) neckInit = false; }
  drawLiquid();
}
function liquidTo(main, side) {
  const nextSide = main && side ? 1 : 0;
  if (nextSide && !gsTo) neckInit = false;   // 新开的延伸抽屉：颈从这一次的来源块起步，不从上一次的位置流过来
  gTo = main ? 1 : 0; gsTo = nextSide;
  document.body.style.setProperty("--dw-w", `${main ? 396 + (nextSide ? 374 : 0) : 0}px`);
  if (reduced) { g.v = gTo; gs.v = gsTo; }
  drawLiquid();   // 同一批次里写下起手态，浏览器还没画 —— 第一帧不闪整面
  if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
}

/* ================= 一次渲染全部 ================= */
function render() { renderCanvas(); renderHead(); renderIsland(); renderPop(); renderPanels(); }

/* ================= 聚焦：只认点击 ================= */
function focusCard(id) {
  if (S.sel !== id) S.side = null;
  S.sel = id; S.edgeSel = null;
  render();
}
function blurCard() { S.sel = null; S.side = null; render(); }
// 主抽屉里点一行：开二级抽屉，再点同一行收起；二级抽屉里点一行：就地换成下一层，记住上一层
function focusSide(v, nested) {
  const [kind, ...rest] = v.split(":"), id = rest.join(":");
  if (!nested && skey(rootOf(S.side)) === v) S.side = null;
  else S.side = { kind, id, from: nested ? S.side : null };
  render();
  if (S.side?.kind === "loop") fitLoop();
}
// 悬停：进卡立刻聚焦预览；离开稍等再收，卡与卡之间的缝不闪
const HOVER_OUT = 200;
let hoverT = 0;
const setHover = (id) => { if (S.hover !== id) { S.hover = id; renderCanvas(); } };
bd.addEventListener("pointermove", (e) => {
  if (drag || S.draw) return;
  const id = document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-node]")?.dataset.node ?? null;
  clearTimeout(hoverT);
  if (id) setHover(id); else if (S.hover) hoverT = setTimeout(() => setHover(null), HOVER_OUT);
});
bd.addEventListener("pointerleave", () => { clearTimeout(hoverT); setHover(null); });
function fitLoop() { if (loopOf()) fit([...highlight(G.edges).nodes].map((n) => G.rects.get(n)).filter(Boolean), 1); }

/* ================= 动作 ================= */
function toggleOpen(id) {
  if (!canOpen(byId.get(id))) return;
  if (S.open.has(id)) { S.open.delete(id); for (const x of [...S.open]) if (ancestors(x).includes(id)) S.open.delete(x); }
  else { S.open.add(id); for (const a of ancestors(id)) S.open.add(a); }
  if (S.sel && vis(S.sel) !== S.sel) S.sel = vis(S.sel);
  render();
  // 展开了：镜头跟到新框，放得下就不缩
  const f = S.open.has(id) && G.frames.find((x) => x.n.id === id);
  if (f) fit([f], S.z);
}
function go(id) {
  S.draw = false;   // 找 / 跳转是「看」的动作
  for (const a of ancestors(id)) S.open.add(a);
  S.pop = null; S.side = null;
  focusCard(vis(id)); panTo(id);
}
// 浮岛里挑一条循环：聚焦它所在的卡，二级抽屉讲这条循环；卡是收着的域时，上一层记成主抽屉里装着它的那一行
function openLoop(lid) {
  const l = D.loops.find((x) => x.id === lid), sel = vis(l.endpoint);
  const chain = [...ancestors(l.endpoint), l.endpoint], child = chain[chain.indexOf(sel) + 1];
  S.pop = null; S.draw = false; S.sel = sel;
  S.side = { kind: "loop", id: lid, from: child && child !== l.endpoint && byId.get(child).kids.length ? { kind: "group", id: child, from: null } : null };
  render(); fitLoop();
}

// 体检里挑一项：把它点名的卡都露出来（展开祖先），画布只亮这些，镜头框住
function showFlag(it) {
  Object.assign(S, { pop: null, draw: false, sel: null, side: null, flag: it });
  for (const id of it.nodes) for (const a of ancestors(id)) S.open.add(a);
  render();
  fit([...highlight(G.edges).nodes].map((id) => G.rects.get(id)).filter(Boolean), 1);
}

/* ================= 画模式：写想法 · 改想法 · 拖卡连线 =================
   用户只表达想法（名字 + 介绍），建出来一律 kind: idea；位置就是唯一的结构信息 ——
   落在展开的框里 = 属于那个域，落在某条泳道里 = 那一端，都不在 = 最左的「想法」泳道。
   归成域 / 端点 / 表 / 事件是 agent 和用户商量后改文件的事，这里不问 */
const np = document.getElementById("np");
const KIND_CN = { idea: "想法", domain: "域", endpoint: "端点", table: "表", event: "事件", file: "模块" };
function newAt(cx, cy) {
  const wx = (cx - S.tx) / S.z, wy = (cy - S.ty) / S.z;
  const inR = (r) => wx >= r.x && wx <= r.x + r.w && wy >= r.y && wy <= r.y + r.h;
  const f = G.frames.filter(inR).sort((a, b) => a.w * a.h - b.w * b.h)[0];
  openNp({ x: cx, y: cy, parent: f?.n.id ?? null, lane: G.lanes.find(inR)?.id ?? "idea" });
}
// 双击想法卡：就地改名字 / 介绍，往里加、删除也在这里
function editAt(cx, cy, id) {
  const x = JSON.parse(ITXT).nodes.find((n) => n.id === id);
  openNp({ x: cx, y: cy, edit: id, kind: x.kind, label: x.label, desc: x.desc ?? "" });
}
function openNp(s) {
  S.np = { err: "", ...s };
  np.innerHTML = "";
  renderNp(true);
}
function renderNp(focus) {
  np.hidden = !S.np;
  if (!S.np) return;
  const s = S.np, p = s.parent && byId.get(s.parent);
  const val = (k) => esc(np.querySelector(`[data-f=${k}]`)?.value ?? s[k] ?? "");
  const head = s.edit ? `${ic("info", 14)}改${KIND_CN[s.kind]}${s.kind !== "idea" ? `<span class="chip a" title="agent 归类后的种类">已归类</span>` : ""}`
    : `${ic("plus", 14)}写到<span class="chip">${esc(p ? p.human ?? p.label : D.lanes.find((l) => l.id === s.lane).name)}</span>`;
  np.innerHTML = `<div class="nh">${head}</div>
    <input data-f="label" autocomplete="off" spellcheck="false" placeholder="名字" value="${val("label")}">
    <textarea data-f="desc" autocomplete="off" spellcheck="false" rows="3" placeholder="介绍：想要它干什么（可空）">${val("desc")}</textarea>
    ${s.err ? `<div class="er">${esc(s.err)}</div>` : ""}
    <div class="lcs"><button class="act" data-np-ok>${ic(s.edit ? "info" : "plus", 14)}${s.edit ? "保存" : "写下"}　⏎</button>${s.edit ? `<button class="act" data-np-sub>${ic("plus", 14)}往里加</button><button class="act" data-np-del>${ic("close", 14)}删除</button>` : ""}</div>`;
  const r = np.getBoundingClientRect();
  np.style.transform = `translate(${clamp(s.x - 20, 12, innerWidth - r.width - 12)}px,${clamp(s.y + 12, 12, innerHeight - r.height - 12)}px)`;
  if (focus) np.querySelector("[data-f=label]").focus();
}
function closeNp() { S.np = null; renderNp(); }
function reveal(id) { for (const a of ancestors(id)) S.open.add(a); render(); panTo(id); }
async function submitNp() {
  const s = S.np, v = (k) => np.querySelector(`[data-f=${k}]`).value.trim();
  const label = v("label"), desc = v("desc");
  if (!label) { s.err = "要个名字"; return renderNp(); }
  closeNp();
  if (s.edit) return edit((I) => { const x = I.nodes.find((n) => n.id === s.edit); x.label = label; if (desc) x.desc = desc; else delete x.desc; });
  const x = { id: "i:" + Date.now().toString(36), kind: "idea", label, ...(s.parent ? { parent: s.parent } : { lane: s.lane }), ...(desc ? { desc } : {}) };
  if (await edit((I) => I.nodes.push(x)) && byId.has(x.id)) reveal(x.id);
}
// 连线种类按两端推：指向表 = 写，指向事件 = 推送，客户端到服务端 = 请求，其余 = 调用；要别的种类让 agent 改文件
function linkKind(a, b) {
  const B = byId.get(b), la = laneOf(byId.get(a).col)?.id, lb = laneOf(B.col)?.id;
  return B.kind === "table" ? "writes" : B.kind === "event" ? "push" : la === "client" && lb === "server" ? "request" : "calls";
}
function linkTo(a, b) { if (a !== b) edit((I) => I.edges.push({ from: a, to: b, k: linkKind(a, b) })); }
function delNode(id) {
  closeNp();
  edit((I) => {
    const gone = new Set([id]);
    for (let grew = true; grew;) { grew = false; for (const x of I.nodes) if (x.parent && gone.has(x.parent) && !gone.has(x.id)) { gone.add(x.id); grew = true; } }
    I.nodes = I.nodes.filter((x) => !gone.has(x.id));
    I.edges = I.edges.filter((e) => !gone.has(e.from) && !gone.has(e.to));
  });
}
// 拖卡连线时的临时线：从起点卡中心到指针
let tmpLn = null;
function tmpLine(d) {
  if (!d) return tmpLn?.remove();
  tmpLn ??= document.createElementNS("http://www.w3.org/2000/svg", "path");
  tmpLn.setAttribute("class", "ln plan");
  tmpLn.setAttribute("d", d);
  wE.appendChild(tmpLn);
}
np.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  const s = S.np;
  if ("npOk" in t.dataset) submitNp();
  else if ("npSub" in t.dataset) openNp({ x: s.x, y: s.y, parent: s.edit });
  else if ("npDel" in t.dataset) delNode(s.edit);
});
np.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submitNp(); } });   // ⇧⏎ 介绍里换行；输入法选字的回车不算

/* ================= 输入 ================= */
let drag = null, moved = false;
bd.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  if (S.np) closeNp();
  world.style.transition = "";
  const from = S.draw && !e.target.closest("[data-exp]") ? e.target.closest("[data-node]")?.dataset.node : null;
  drag = { x: e.clientX, y: e.clientY, tx: S.tx, ty: S.ty, from }; moved = false; bd.setPointerCapture(e.pointerId);
});
bd.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 4) return;
  moved = true;
  if (drag.from) {
    const r = G.rects.get(drag.from), x0 = r.x + r.w / 2, y0 = r.y + r.h / 2, x1 = (e.clientX - S.tx) / S.z, y1 = (e.clientY - S.ty) / S.z;
    return tmpLine(`M${x0},${y0} L${x1},${y1}`);
  }
  bd.classList.add("is-panning"); S.tx = drag.tx + dx; S.ty = drag.ty + dy; applyView();
});
bd.addEventListener("pointerup", (e) => {
  bd.classList.remove("is-panning");
  const wasDrag = moved, from = drag?.from; drag = null;
  if (from && wasDrag) {
    tmpLine(null);
    const to = document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-node]")?.dataset.node;
    if (to) linkTo(from, to);
    return;
  }
  if (wasDrag) return;
  const t = document.elementFromPoint(e.clientX, e.clientY);
  const exp = t?.closest("[data-exp]");
  if (exp) return toggleOpen(exp.dataset.exp);
  const node = t?.closest("[data-node]");
  if (S.draw) return;   // 画模式单击不开抽屉
  if (node) { const id = node.dataset.node; return S.sel === id ? blurCard() : focusCard(id); }
  if (S.sel || S.pop) { S.pop = null; blurCard(); }
  else if (S.flag) { S.flag = null; render(); }
});
bd.addEventListener("dblclick", (e) => {
  const t = document.elementFromPoint(e.clientX, e.clientY);   // pointerdown 抓了指针，e.target 恒为画布：按坐标取真正点到的元素
  const node = t?.closest("[data-node]");
  if (!node) { if (S.draw && !t?.closest("[data-exp]")) newAt(e.clientX, e.clientY); return; }
  const n = byId.get(node.dataset.node);
  if (S.draw && n.plan) return editAt(e.clientX, e.clientY, n.id);
  if (canOpen(n)) toggleOpen(n.id); else if (n.parent && canOpen(byId.get(n.parent))) toggleOpen(n.parent);
});
bd.addEventListener("wheel", (e) => {
  e.preventDefault();
  world.style.transition = "";
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
  else { S.tx -= e.deltaX; S.ty -= e.deltaY; applyView(); }
}, { passive: false });
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-pop],[data-flag],[data-unflag],[data-close],[data-go],[data-openloop],[data-side],[data-step],[data-exp-panel],[data-draw],[data-back],[data-htab],[data-flow],[data-flowclose],[data-view]");
  if (!t || bd.contains(t)) return;
  const d = t.dataset;
  if (d.flow) return openFlow(d.flow);
  if ("flowclose" in d) return closeFlow();
  if (d.view && t.closest("#fp")) {
    FVIEW.set(S.flow, d.view);
    for (const b of document.querySelectorAll("#fp .vseg button")) { const on = b.dataset.view === d.view; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); }
    const map = fpMap(); if (map) map.innerHTML = "";   // 换画法不做位移过渡：节点不是同一种摆法
    return renderFlowMap();
  }
  if (d.draw) { S.draw = d.draw === "1"; closeNp(); return blurCard(); }
  if (d.htab && !d.pop) { S.htab = +d.htab; return renderPop(); }
  if (d.pop) { const tab = d.htab ? +d.htab : null; S.pop = S.pop === d.pop && (tab === null || tab === S.htab) ? null : d.pop; S.htab = tab ?? S.htab ?? Math.max(0, (D.findings ?? []).findIndex((f) => f.items.length)); S.find = ""; return render(); }
  if (d.flag) { const [fi, ii] = d.flag.split(":").map(Number); return showFlag(D.findings[fi].items[ii]); }
  if ("unflag" in d) { S.flag = null; return render(); }
  if (d.close === "main") return blurCard();
  if (d.close === "side") { S.side = null; return render(); }
  if ("back" in d) { S.side = S.side?.from ?? null; return render(); }
  if (d.expPanel) return toggleOpen(d.expPanel);
  if (d.openloop) return openLoop(d.openloop);
  if (d.side) return focusSide(d.side, pS.contains(t));
  if (d.go) return go(d.go);
  if (d.step) { const [a, b] = d.step.split(SEP); return fit([G.rects.get(a), G.rects.get(b)].filter(Boolean), 1); }
});
document.addEventListener("input", (e) => { if (e.target.id === "dq") { S.find = e.target.value; renderPop(); } });
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.np) return closeNp();
  if (e.target.matches?.("input, textarea") && e.key !== "Escape") return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); S.pop = "find"; S.find = ""; return render(); }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape" && S.flow) return closeFlow();
  if (S.flow) return;   // 流程页开着：画布快捷键不响应
  if (e.key === "Escape") { if (S.pop) { S.pop = null; return render(); } if (S.flag) { S.flag = null; return render(); } if (S.side) { S.side = S.side.from ?? null; return render(); } if (S.sel) return blurCard(); return; }
  if (e.key === "!" || (e.shiftKey && e.code === "Digit1")) return fitAll();
  if (e.key === "+" || e.key === "=") return zoomAt(1.25);
  if (e.key === "-") return zoomAt(0.8);
  if (e.key.toLowerCase() === "t") { const h = document.documentElement; h.dataset.theme = h.dataset.theme === "light" ? "dark" : "light"; localStorage.setItem("atlas.theme", h.dataset.theme); }
});
addEventListener("resize", () => drawLiquid());

document.documentElement.dataset.theme = localStorage.getItem("atlas.theme") ?? "dark";   // 默认黑底；T 可临时切亮
(async () => {
  try {
    if (LIVE) {
      await pull();
      setInterval(() => pull().then(() => { if (S.err?.startsWith("连不上")) { S.err = null; renderHead(); } }, (err) => { S.err = `连不上 serve.ts：${err.message}`; renderHead(); }), 1000);
    }
    render(); fitAll(false);
  } catch (err) {
    console.error(err);
    document.body.insertAdjacentHTML("beforeend", `<div class="fail"><b>图没画出来</b>数据或排版出错，重新生成一次试试。<span title="${esc(err.message)}"> ⓘ</span></div>`);
  }
})();
</script>
</body>
