<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>对照版 · TOPIC</title>
<!--
  干什么：TOPIC 的多档对照（morii-compare 模板）。比几个界面就写几个界面，每个界面有自己的样本、自己的一套档（第 0 档 = 现状）。
         顶条 = 怎么看；左栏 = 界面 · 轮次 · 档；右栏 = agent 定的滑块（I 收起）；右下角 = 发送。
         默认单看一档；C 现状对选中，A 本界面全部档，G 全部界面并排（每格头上一排档号，各切各的）。
         标注（F）：点哪个组件就在哪儿落一枚点、写一句要改什么；发送把标注 + 各界面选的档 + 参数 + 布局交给等着的 agent（⌘⏎）。
         经对照版服务（serve.mjs，跑在容器里）打开：页面一改自动刷新，agent 的回话出现在右下角；直接打开文件也能看，发送变成拷进剪贴板。
         台子与被比较物彻底分开：每格样本挂一个 Shadow DOM，档的样式只进自己的影子。
  怎么跑：lab.sh <项目根> 起服务，浏览器开它打印的地址 + /docs/lab/<topic>.html（见 SKILL.md ⑦）；数字 / ← → 档 · ↑ ↓ 界面 · S 样本 · R 轮次 · F 标注 ·
         M 看法 · C / A / G 看几档 · T 明暗 · I 滑块 · P 重播 · ⌘Z / ⇧⌘Z 撤回重做 · ⌘⏎ 发送 · ? 键位。
  需要什么：下面 <link> 指向项目 token 源（只吃自定义属性，影子里照样继承）。改题目只动脚本第 ② 段（TOPIC / KEY / CSS / PAGES），写法见 morii-compare 的 SKILL.md ④。
-->
<link rel="stylesheet" href="../../src/styles/tokens.css">
<!-- 首帧前先按系统明暗定底色（暗色系统不闪白）；存过的手选值由脚本随后接管 -->
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/* ---- 可调参数 ---------------------------------------------------------- */
:root {
  --top-h: 52px;     /* 顶条高 */
  --list-w: 248px;   /* 左栏宽：界面 · 轮次 · 档 */
  --dock-w: 264px;   /* 右栏宽：滑块 + 发送 */
  --gap: 10px;       /* 岛离窗边 */
  --grid: 16px;      /* 舞台点阵间距（拼装吸附 = 它的一半，见脚本 SNAP） */
}

/* ================= 台子（实验台自己，不是被比较的东西） ================= */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg-content); color: var(--ink-2); font: 13px/1.45 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
.ic { flex: none; display: block; }
.isl button, .fab { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.isl textarea { -webkit-user-select: text; user-select: text; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* 舞台：满铺点阵板；上让顶条、左让清单、右让滑块，格子永远不被压 */
.board { position: fixed; inset: 0; overflow: auto;
  padding: calc(var(--top-h) + var(--gap) + 12px) calc(var(--dock-w) + var(--gap) * 2) calc(var(--gap) * 2) calc(var(--list-w) + var(--gap) * 2);
  background: var(--bg-content) radial-gradient(circle, var(--sep-strong) 1px, transparent 1.2px) 0 0 / var(--grid) var(--grid);
  transition: padding-right var(--t-slow) var(--ease-out), background-color var(--t-slow) var(--ease-hover); }
body.dock-off .board, body.no-dock .board { padding-right: 0; }

/* 玻璃：料照抄 base.css 的 .ink-glass（前端 ADR 0076），影用 --shadow-float */
.isl { z-index: 10; border-radius: var(--r-md); border: 0.5px solid var(--chin-edge); background: var(--chin-glass); box-shadow: var(--shadow-float);
  backdrop-filter: blur(var(--glass-blur)) saturate(1.4); -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
  -webkit-user-select: none; user-select: none; cursor: default;
  transition: transform var(--t-slow) var(--ease-out), opacity var(--t-fast) var(--ease-hover), background-color var(--t-slow) var(--ease-hover); }

/* 顶条横跨舞台；左栏、右栏从顶条下面一直到底（--side-top 由脚本按顶条实际高度写） */
.lane { position: fixed; left: var(--gap); right: var(--gap); z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
.lane.top { top: var(--gap); }
.lane.side { top: var(--side-top, 72px); bottom: var(--gap); right: auto; width: var(--list-w); align-items: stretch; }
.lane.right { top: var(--side-top, 72px); bottom: var(--gap); left: auto; width: var(--dock-w); align-items: stretch; }
body.no-dock #dock, body.no-dock #dockT { display: none; }
body.dock-off #dock { transform: translateX(calc(100% + var(--gap) * 2)); opacity: 0; pointer-events: none; }
.bar { pointer-events: auto; display: flex; align-items: center; max-width: 100%; }
#topbar { width: 100%; height: var(--top-h); padding: 0 8px 0 16px; gap: 2px; }
#topbar .sp { flex: 1; }
#topbar > * { flex-shrink: 0; }
#topbar > .sp { flex-shrink: 1; }
@media (max-width: 1340px) { .brand { max-width: 140px; overflow: hidden; text-overflow: ellipsis; } #topbar .seg button, #topbar .togs button { padding: 0 7px; } #topbar .tg { padding: 0 4px; } }
.tg { display: flex; align-items: center; gap: 4px; padding: 0 6px; }
.brand { margin: 0 10px 0 0; font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
/* 钉住只在静态时有：宽度收放，不突然出现 */
.pinw { max-width: 360px; opacity: 1; overflow: hidden; transition: max-width var(--t-slow) var(--ease-out), opacity var(--t-fast) var(--ease-hover), padding var(--t-slow) var(--ease-out); }
body:not([data-mode="static"]) .pinw { max-width: 0; opacity: 0; padding: 0; }
.isl .tbtn { height: 30px; padding: 0 9px; border-radius: var(--r-xs); font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
  transition: background-color var(--t-fast) var(--ease-hover), color var(--t-fast) var(--ease-hover); }
.isl .tbtn:hover { background: var(--hover-2); color: var(--ink); }
.isl .tbtn.warn { color: var(--warn); }

/* 左栏一座岛：界面（多个才有）→ 轮次（多轮才有，点开全部）→ 档（选中那档展开论点 · 零件 · 代价） */
#nav { flex: 0 1 auto; min-height: 0; flex-direction: column; align-items: stretch; gap: 6px; padding: 8px; overflow-y: auto; scrollbar-width: none; }
#nav::-webkit-scrollbar { display: none; }
#pl:not(:empty) { padding-bottom: 8px; border-bottom: 1px solid var(--sep); }
.rrow:empty { display: none; }
.isl .rbtn { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px 0 6px; border-radius: var(--r-sm); text-align: left;
  transition: background-color var(--t-fast) var(--ease-hover); }
.isl .rbtn:hover, .isl .rbtn.open { background: var(--hover); }
.rbtn b { flex: 1; min-width: 0; font-size: 13px; font-weight: 650; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rbtn .badge { min-width: 26px; }
.vl { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.vi, .pi { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 8px; padding: 6px 8px; border-radius: var(--r-sm); color: var(--ink-3); cursor: pointer;
  transition: background-color var(--t-fast) var(--ease-hover), color var(--t-fast) var(--ease-hover); }
.pi { grid-template-columns: 1fr auto; }
.vi:hover, .pi:hover { background: var(--hover); color: var(--ink); }
.vi.on, .pi.on { background: var(--hover); color: var(--ink); cursor: default; }
.vi > b, .pi > b { min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vi.on > b, .pi.on > b { font-weight: 700; }
.pi .badge { min-width: 20px; height: 20px; font-size: 10.5px; }
.vd { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 9px; padding: 8px 0 4px; animation: in-up var(--t-slow) var(--ease-out); }
.vd > p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }
.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 12px; line-height: 1.45; }
.kv dt { color: var(--ink-4); white-space: nowrap; }
.kv dd { margin: 0; font-weight: 600; color: var(--ink); }
.vcost { display: flex; flex-direction: column; gap: 3px; padding: 8px 9px; border-radius: 9px; background: color-mix(in srgb, var(--warn) 11%, transparent); font-size: 12px; line-height: 1.55; color: var(--ink-2); }
.vcost .stamp { align-self: flex-start; }

/* 右栏：上 = 滑块（agent 定，用户只管拉）；下 = 发出去的东西（agent 回话 · 标注清单）+ 发送 */
#dock { flex: 0 1 auto; min-height: 0; flex-direction: column; align-items: stretch; padding: 12px 12px 14px; gap: 18px; overflow-y: auto; scrollbar-width: none; }
#dock::-webkit-scrollbar { display: none; }
#dock:has(.kgrp:empty) { visibility: hidden; }
.kgrp { flex: none; display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
.out { margin-top: auto; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-height: 0; }
.tray { pointer-events: auto; width: 100%; max-height: 44vh; padding: 6px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; scrollbar-width: none; }
.reply { display: flex; align-items: flex-start; gap: 4px; padding: 8px 4px 8px 10px; border-radius: 10px; background: var(--accent-soft); }
.reply:empty, .nl:empty { display: none; }
.reply p { flex: 1; margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
.reply .ibtn { width: 24px; height: 24px; }
.nl li { cursor: pointer; transition: background-color var(--t-fast) var(--ease-hover); }
.nl li:hover { background: var(--hover-2); }
.nl li.sent { opacity: .45; }
/* 发送：反差色悬浮键，浮在右下角；有没发的标注时带个数 */
.fab { pointer-events: auto; height: 44px; padding: 0 18px 0 15px; border-radius: 22px; display: inline-flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 650; background: var(--ink); color: var(--bg-content); box-shadow: var(--shadow-float);
  transition: transform var(--t-press) var(--ease-out), opacity var(--t-fast) var(--ease-hover); }
.fab:active:not(:disabled) { transform: scale(var(--press)); }
.fab:disabled { opacity: .3; cursor: default; }
.fab .n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font: 650 11px/20px var(--font-mono); text-align: center; background: var(--accent); color: var(--on-accent); }
.dbtn { height: 30px; padding: 0 6px 0 8px; border-radius: var(--r-xs); display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2);
  transition: background-color var(--t-fast) var(--ease-hover), color var(--t-fast) var(--ease-hover); }
.dbtn:hover, .dbtn.open { background: var(--hover-2); color: var(--ink); }
.dbtn .badge { min-width: 20px; height: 20px; font-size: 10.5px; }
.kh .badge { min-width: 0; height: 18px; line-height: 18px; font-size: 10px; padding: 0 5px; border-radius: 5px; }

/* 记录弹层：顶上形状图（改后实面 vs 默认虚影），底下一行改动类动作 */
#histPop { width: 340px; }
#histPop .fig { width: auto; height: 116px; }
#histPop .fig-box { inset: 12px 14px 20px; }
#histPop .fig-dim { font-size: 10.5px; bottom: -16px; }
.hist time { margin-left: auto; font: 500 10.5px var(--font-mono); color: var(--ink-4); }
.hist li { gap: 7px; }
.hist .nm { flex: none; }
.hist li > .ic { flex: none; color: var(--ink-3); }
.hist .badge { min-width: 20px; height: 20px; font-size: 10.5px; }
.hist li.danger .nm { color: var(--crit); }
.hist li.undone { opacity: .45; }
.hist li.undone .nm { text-decoration: line-through; }
.hist li.say { background: var(--accent-soft); }
.hist li.say .nm, .hist li.note .nm { flex: 0 1 auto; min-width: 0; }
.chg .nm { flex: 0 1 auto; }
.pfoot { display: flex; gap: 6px; }
.mini { height: 28px; padding: 0 10px 0 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-3); background: var(--hover);
  transition: background-color var(--t-fast) var(--ease-hover), color var(--t-fast) var(--ease-hover); }
.mini:hover { background: var(--hover-2); color: var(--ink); }

/* 弹层（记录 / 键位 / 轮次）：从按钮往下长出来 */
.pop { position: fixed; z-index: 20; width: 260px; max-height: 70vh; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px;
  opacity: 0; transform: translateY(-8px) scale(.98); transform-origin: top right; pointer-events: none; }
.pop.left { transform-origin: top left; }
.pop.open { opacity: 1; transform: none; pointer-events: auto; }
#roundPop { width: 300px; padding: 6px; gap: 2px; }
.rl { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.rl li { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 8px 0 6px; border-radius: var(--r-sm); color: var(--ink-2); cursor: pointer;
  transition: background-color var(--t-fast) var(--ease-hover); }
.rl li:hover { background: var(--hover); }
.rl li.on { background: var(--hover-2); color: var(--ink); }
.rl li b { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rl .badge { min-width: 26px; }
/* 标注小框：贴着那枚点长出来，回车存、Esc 放弃、点外面也存 */
.cmp { position: fixed; z-index: 25; width: 300px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
  opacity: 0; transform: scale(.97); transform-origin: top left; pointer-events: none; }
.cmp.open { opacity: 1; transform: none; pointer-events: auto; }
.cmp .ch { display: flex; align-items: center; gap: 7px; min-height: 26px; }
.cmp .ch .nm { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 650; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmp textarea { width: 100%; display: block; resize: none; border: 0; outline: none; border-radius: var(--r-sm); background: var(--hover); color: var(--ink);
  font: 13px/1.55 var(--font); padding: 8px 10px; field-sizing: content; min-height: 56px; max-height: 220px; }
.cmp textarea:focus { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); }

/* 节：图标 + 名 + 右侧等宽元信息 / 图标钮 */
.sh { display: flex; align-items: center; gap: 8px; min-height: 26px; padding-left: 2px; }
.sh > .ic { color: var(--ink-3); }
.sh h3 { flex: 1; margin: 0; font-size: 13px; font-weight: 650; color: var(--ink); }
.sh .meta { font: 500 11px var(--font-mono); color: var(--ink-4); }
.ibtn { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-3);
  transition: background-color var(--t-fast) var(--ease-hover), color var(--t-fast) var(--ease-hover), transform var(--t-press) var(--ease-out); }
.ibtn:hover { background: var(--hover-2); color: var(--ink); }
.ibtn:active { transform: scale(var(--press)); }
.ibtn.ok { color: var(--accent); }
.ibtn.err { color: var(--crit); }
.ibtn.open, .ibtn[aria-pressed="true"] { background: var(--hover-2); color: var(--ink); }

/* 编号章：等宽实心小章，选中填强调色（ParamField / SegControl 的「强调实心」） */
.badge { flex: none; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 7px; display: inline-grid; place-items: center;
  font: 650 11.5px/1 var(--font-mono); background: var(--hover-2); color: var(--ink-3);
  transition: background-color var(--t-med) var(--ease-hover), color var(--t-med) var(--ease-hover); }
.on > .badge, .badge.on { background: var(--accent); color: var(--on-accent); }
.tag { flex: none; font: 500 10.5px/18px var(--font-mono); padding: 0 6px; border-radius: 6px; background: var(--hover-2); color: var(--ink-3); white-space: nowrap; }

/* 开关组（交互 / 拼装各自独立开关，都关 = 静态；标注是单独一颗）：开着的那颗强调实心 */
.togs { display: flex; gap: 2px; padding: 2px; border-radius: var(--r-sm); background: var(--hover); }
.togs button { min-height: 30px; padding: 0 10px; border-radius: var(--r-xs); display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); white-space: nowrap;
  transition: background-color var(--t-med) var(--ease-hover), color var(--t-med) var(--ease-hover), transform var(--t-press) var(--ease-out); }
.togs button:hover { background: var(--hover-2); color: var(--ink); }
.togs button:active { transform: scale(var(--press)); }
.togs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 650; }
/* 段控：照抄 SegControl 默认款——一条轨道，强调色块滑到选中那格 */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px; border-radius: var(--r-sm); background: var(--hover); }
.seg .thumb { position: absolute; top: 0; left: 0; border-radius: var(--r-xs); background: var(--accent); pointer-events: none; }
.seg.moving .thumb { transition: transform var(--t-med) var(--ease-in-out), width var(--t-med) var(--ease-in-out), height var(--t-med) var(--ease-in-out); }
.seg button { position: relative; min-width: 0; min-height: 30px; padding: 0 10px; border-radius: var(--r-xs); color: var(--ink-3); font-size: 13px; white-space: nowrap;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background-color var(--t-fast) var(--ease-hover), color var(--t-fast) var(--ease-hover), transform var(--t-press) var(--ease-out); }
.seg button[aria-pressed="true"] { color: var(--on-accent); font-weight: 650; }
.seg button:not([aria-pressed="true"]):hover { background: var(--hover-2); color: var(--ink); }
.seg button:active:not([aria-pressed="true"]) { transform: scale(var(--press)); }
/* 次要段控（样本 / 钉住 / 看几档）：色块是浮起的一片面板，不抢主键的强调色 */
.seg.sub .thumb { background: var(--bg-content); box-shadow: var(--shadow-sm); }
.seg.sub button[aria-pressed="true"] { color: var(--ink); }

.stamp { flex: none; font: 650 10.5px/18px var(--font); padding: 0 6px; border-radius: 6px; background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; font-size: 11.5px; color: var(--ink-3); }
.ink-kbd { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 6px; background: var(--hover-2); display: inline-flex; align-items: center; justify-content: center;
  font: 600 10.5px var(--font-mono); color: var(--ink-2); }

/* 刻度轨：照抄 ScaleTrack——每 tick 一道刻度，走过的染强调色，默认值下一粒刻痕，游标是带数的强调实心章 */
.knob { flex: none; width: 100%; display: flex; flex-direction: column; gap: 5px; }
.kh { display: flex; align-items: center; gap: 6px; padding: 0 2px; min-height: 18px; white-space: nowrap; }
.kh .nm { flex: 1; font-size: 12.5px; color: var(--ink-2); }
.kh .dl { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px var(--font-mono); color: var(--ink-4);
  opacity: 0; transform: translateX(4px); transition: opacity var(--t-fast) var(--ease-hover), transform var(--t-med) var(--ease-out); }
.knob.dirty .kh .dl { opacity: 1; transform: none; }
.kh .dl b { font-weight: 650; color: var(--ink); }
.kh .dl em { font-style: normal; font-weight: 650; padding: 0 5px; border-radius: 5px; line-height: 17px;
  background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-ink); }
.kh .unit { font: 500 11px var(--font-mono); color: var(--ink-4); }
.track { --pad: 20px; position: relative; height: 32px; padding: 0 var(--pad); border-radius: var(--r-sm); background: var(--hover); cursor: pointer; touch-action: none; outline: none; }
.track:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tick { position: absolute; top: 50%; width: 2px; height: 8px; margin-left: -1px; translate: 0 -50%; border-radius: 1px; background: var(--sep-strong); transition: background-color var(--t-fast) var(--ease-hover); }
.tick.end { height: 12px; }
.tick.on { background: var(--accent); }
.notch { position: absolute; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 2px; background: var(--ink-3); }
.trk { position: absolute; top: 0; bottom: 0; left: var(--pad); right: var(--pad); pointer-events: none; transition: translate var(--t-fast) var(--ease-out); }
.track.live .trk { transition: none; }
.cur { position: absolute; left: 0; top: 50%; translate: -50% -50%; height: 26px; min-width: 40px; padding: 0 8px; border-radius: var(--r-xs); background: var(--accent); color: var(--on-accent);
  font: 650 13px var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; display: grid; place-items: center; box-shadow: var(--shadow-sm); transition: scale var(--t-press) var(--ease-out); }
.track.live .cur { scale: 1.06; }

/* 形状图：当前值的面（实）+ 默认值的面（虚影）+ 内距框 + 标题条 + 键条 */
.fig { flex: none; position: relative; width: 112px; height: 68px; border-radius: var(--r-sm); background: var(--hover); overflow: hidden; }
.fig-box { position: absolute; inset: 7px 8px 16px; }
.fig i { position: absolute; display: block; }
/* figure() 用的两枚：.fig-ghost = 默认值的虚影，.fig-face = 当前值的实面；其余细节写 inline style */
.fig-ghost { z-index: 2; border-radius: 6px; border: 1px dashed var(--ink-3); opacity: .7; pointer-events: none; transition: all var(--t-med) var(--ease-out); }
.fig-face { border-radius: 6px; background: var(--panel-strong); box-shadow: var(--shadow-sm); transition: all var(--t-med) var(--ease-out); }
.fig-dim { position: absolute; right: 0; bottom: -14px; font: 600 9.5px var(--font-mono); color: var(--ink-3); white-space: nowrap; }

/* 清单行（记录 / 标注）：章 · 名 · 改前 → 改后 · 增量 */
.chg { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.chg li { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 10px; border-radius: 9px; background: var(--hover); animation: in-up var(--t-slow) var(--ease-out) backwards; }
.chg .nm { flex: 1; min-width: 0; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nl .nm { flex: 1; }
.chg .was { font: 500 12px var(--font-mono); color: var(--ink-4); }
.chg .arr { color: var(--ink-4); font-size: 11px; }
.chg .now { font: 650 12px var(--font-mono); color: var(--ink); }
.chg em { font: normal 650 11px/17px var(--font-mono); padding: 0 5px; border-radius: 5px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-ink); }
.chg .xy { font: 600 11px/18px var(--font-mono); padding: 0 6px; border-radius: 6px; background: var(--hover-2); color: var(--ink-2); }
.chg li.empty { background: none; color: var(--ink-3); padding: 0 2px; }

/* 平铺：列数与比例由脚本按舞台大小算（--cols / --zoom），间距与内边距和脚本里 GAP / PAD 一致 */
.stage { zoom: var(--zoom, 1); display: grid; grid-template-columns: repeat(var(--cols, 3), var(--tile-w)); gap: 28px; padding: 24px 32px 32px; width: max-content; margin: 0 auto; }
.tile { display: flex; flex-direction: column; gap: 10px; }
.intro .tile { animation: in-up var(--t-slow) var(--ease-out) backwards; animation-delay: var(--d, 0ms); }   /* 只在首屏与 P 重播时逐格入场；换档 / 界面 / 轮次直接换 */
.tile .lbl { height: 24px; display: flex; align-items: center; gap: 8px; font: 500 13.5px var(--font); color: var(--ink-3); cursor: pointer; -webkit-user-select: none; user-select: none; }
body[data-view="one"] .tile .lbl { display: none; }   /* 单看：档名已在左栏 */
.tile.sel .lbl { color: var(--ink); font-weight: 650; }
/* 全部界面并排：格头 = 界面名 + 一排档号（各切各的） */
.lbl .tn { padding: 0; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; white-space: nowrap; }
.lbl .chips { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--hover); }
.lbl .chip { min-width: 22px; height: 20px; padding: 0 4px; border: 0; border-radius: 6px; background: none; font: 650 11px/20px var(--font-mono); color: var(--ink-3); cursor: pointer;
  transition: background-color var(--t-fast) var(--ease-hover), color var(--t-fast) var(--ease-hover); }
.lbl .chip:hover { background: var(--hover-2); color: var(--ink); }
.lbl .chip.on { background: var(--accent); color: var(--on-accent); }
.host { display: flex; }
.lab-empty { margin: 80px auto; max-width: 520px; padding: 18px 20px; border-radius: var(--r-md); background: color-mix(in srgb, var(--crit) 10%, transparent); color: var(--ink); font-size: 13px; line-height: 1.6; }
.lab-empty b { color: var(--crit); }

@keyframes in-up { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>

/* 平铺：试每种列数，取比例最大的那种（不放大；同比例取列多的）；最大也低于 MIN_Z 就保底 MIN_Z 并滚动 */

/* ---- 发送：标注 + 每个界面选的档 + 改过的参数与布局，一批交出去 ----

  const take = (ps, vals) => Object.fromEntries((ps ?? []).filter((p) => p.key in vals).map((p) => [p.key, fmt(p, vals[p.key])]));
  PAGES_.forEach((p, g) => {
    const r = rnd(g), rd = p.rounds[r], pre = multi() ? p.name + " · " : "";
    const sp = take(rd.params, shared(g, r));

    rd.list.forEach((v, i) => {
      const op = take(v.params, own(vk(g, r, i))), L = load("L" + vk(g, r, i), {});
      if (Object.keys(op).length) params[pre + vname(g, r, i)] = op;

}

  const { params, layout } = changes();

    页: location.pathname, 题目: TOPIC,
    在看: { 界面: PG().name, 轮: `R${rnd() + 1} ${R().name}`, 档: vname(pg, rnd(), selI()), 样本: S().from },
    选档: picked(),
    标注: notes.filter((n) => n.state === "open").map((n) => { const [g, r, i] = at3(n.k); return { 号: n.no, 界面: PAGES_[g].name, 档: `R${r + 1} · ${vname(g, r, i)}`, 样本: PAGES_[g].specs[n.s].from, 组件: n.name, 具名: n.part || undefined, 路径: n.css, 原文: n.text, html: n.html, 要改: n.note }; }),

  const rd = roundOfK(k), s = specOfRoot(root), i = at3(k)[2], face = root.querySelector(".root");

  }, true);
  root.addEventListener("click", (e) => {

    settle(k, id, { x: 0, y: 0 }); setSize(k, id, null, null);

    follow(root);
  }
  for (const k of new Set(hosts().map((h) => h.dataset.vk))) for (const [id, p] of Object.entries(load("L" + k, {}))) { setPos(k, id, p.x ?? 0, p.y ?? 0); if (p.w != null) setSize(k, id, p.w, p.h); }
  applyParams();
  if (isStatic() && pinned !== "rest") requestAnimationFrame(() => hosts().forEach((h) => roundOfK(h.dataset.vk).pin?.(h.shadowRoot, pinned, specOfRoot(h.shadowRoot))));
  renderKnobs(); syncChrome();
}
/* 换界面 / 样本 / 轮次 / 钉住 / 选档：直接换，不淡出不入场（甲方 2026-10-10：切换要干脆，别黑一下）；intro = 首屏与 P 重播才逐格入场 */
function render(intro = false) {
  for (const a of settling.values()) a.stop();
  stage.classList.toggle("intro", intro);
  paint();
}
/* 选档：全档时只换焦点（格不重画，滑块、形状图跟过去）；其余直接换 */
function setV(i) {
  save(`v${pg}.${rnd()}`, i);
  if (view !== "all") return render();
  renderKnobs(); syncChrome();
  if (openPop === "histPop") renderFig();
}
/* 全部界面并排时点格头的档号：那个界面换成那一档，焦点也挪过去 */
function setSel(g, i) { pg = g; save("g", g); save(`v${g}.${rnd(g)}`, i); renderChrome(); render(); }
/* 换界面：全部界面并排时每个界面都在台上，只换焦点 */
function setPg(g) { pg = g; save("g", g); renderChrome(); if (isPages()) { renderKnobs(); syncChrome(); } else render(); }
const setSpec = (s) => { save("s" + pg, s); render(); };
const setView = (w) => { view = w; save("w", w); render(); };
const setRound = (r) => { save("r" + pg, r); renderChrome(); render(); };
function setFlags(live, build) {
  const repaint = isStatic() && pinned !== "rest";
  flags.live = live; flags.build = build; save("f", flags);
  if (!isStatic()) pinned = "rest";
  hosts().forEach((h) => { h.dataset.mode = modeStr(); if (!live) closeMenu(h.shadowRoot); if (!build) showHud(h.shadowRoot, null); });
  if (repaint) render(); else syncChrome();
}
/* M：只交互（默认）→ 两开 → 只拼装 → 静态 → 只交互 */
const CYCLE = [[true, false], [true, true], [false, true], [false, false]];
/* 明暗：默认「系统」跟随系统（系统切换时跟着变），手选亮 / 暗后记住 */
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
let themePref = load("t", "auto");
const applyTheme = () => { document.documentElement.dataset.theme = themePref === "auto" ? (darkMQ.matches ? "dark" : "light") : themePref; };
darkMQ.addEventListener("change", () => { if (themePref === "auto") { applyTheme(); syncChrome(); } });
function setTheme(t) { themePref = t; save("t", t); applyTheme(); syncChrome(); }
const nextTheme = () => setTheme({ auto: "light", light: "dark", dark: "auto" }[themePref]);   // 系统 → 亮 → 暗 → 系统
function toggleDock() { closePop(); document.body.classList.toggle("dock-off"); save("do", document.body.classList.contains("dock-off")); syncChrome(); }
board.addEventListener("transitionend", (e) => { if (e.target === board && e.propertyName.startsWith("padding")) { applyZoom(); placePins(); } });

/* ---- 输入 ---- */
/* 写着标注时按到别处：先把它存了收起（这一下不再落新点） */
document.addEventListener("pointerdown", (e) => {
  const path = e.composedPath();
  noteSkip = !!editing && !path.includes(cmp) && !path.some((n) => n.classList?.contains("lab-pin"));
  if (noteSkip) closeComposer(true);
}, true);
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-ci],[data-g],[data-note],[data-v],[data-w],[data-s],[data-r],[data-flag],[data-pin],[data-pop],#noteT,#dockT,#zoomT,#themeT,#fab,#replyX,#cmpDel,#resetP,#resetL,#copyJ,.tile");
  if (openPop && !e.target.closest(".pop") && !t?.dataset.pop) closePop();
  if (!t) return;
  if (t.dataset.pop) return togglePop(t.dataset.pop, t);
  if (t.dataset.ci) return setSel(Number(t.dataset.g), Number(t.dataset.ci));
  if (t.dataset.g) return Number(t.dataset.g) === pg ? undefined : setPg(Number(t.dataset.g));
  if (t.dataset.note) return openNote(t.dataset.note);
  if (t.classList.contains("tile")) {   // 点到哪格就选哪格，交互照常
    const [g, r, i] = at3(t.dataset.vk);
    if (g !== pg) return setPg(g);
    if (r === rnd() && i !== selI()) setV(i);
    return;
  }
  if (t.dataset.v) return Number(t.dataset.v) === selI() ? undefined : setV(Number(t.dataset.v));   // 点展开那档自己不重画
  if (t.dataset.w) return setView(t.dataset.w);
  if (t.dataset.s) return Number(t.dataset.s) === spc() ? undefined : setSpec(Number(t.dataset.s));
  if (t.dataset.r) { closePop(); return setRound(Number(t.dataset.r)); }
  if (t.dataset.flag) return t.dataset.flag === "live" ? setFlags(!flags.live, flags.build) : setFlags(flags.live, !flags.build);
  if (t.id === "noteT") return setNoting(!noting);
  if (t.id === "dockT") return toggleDock();
  if (t.id === "zoomT") { fit = !fit; save("z", fit); return applyZoom(); }
  if (t.id === "themeT") return nextTheme();
  if (t.id === "fab") return sendAll();
  if (t.id === "replyX") { save("sv", said.at); return paintOut(); }
  if (t.id === "cmpDel") return dropNote(editing);
  if (t.dataset.pin) { pinned = t.dataset.pin; return render(); }
  if (t.id === "resetP") {
    txn([sk(), ...R().list.map((_, i) => "pv" + vk(pg, rnd(), i))], "参数全部回默认", () => { save(sk(), {}); R().list.forEach((_, i) => save("pv" + vk(pg, rnd(), i), {})); });
    applyParams(); return renderKnobs();
  }
  if (t.id === "resetL") {
    const ks = [...new Set(hosts().map((h) => h.dataset.vk))], parts = (k) => Object.keys(load("L" + k, {}));
    const was = Object.fromEntries(ks.map((k) => [k, parts(k)]));
    txn(ks.map((k) => "L" + k), "零件全部归位", () => ks.forEach((k) => save("L" + k, {})));
    return ks.forEach((k) => was[k].forEach((id) => { settle(k, id, { x: 0, y: 0 }); setSize(k, id, null, null); }));
  }
  if (t.id === "copyJ") return copyJSON(t);
});
cmpT.addEventListener("keydown", (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "Enter" && !e.shiftKey && !e.metaKey && !e.ctrlKey) { e.preventDefault(); closeComposer(true); }
  if (e.key === "Escape") { e.preventDefault(); closeComposer(false); }
});
const dock = $("dock");
const knobLabel = (el) => specOf(el).label;
const knobD = (el) => { const p = specOf(el); return { type: "param", store: storeOf(el.dataset.src), key: p.key, def: p.def, scope: el.querySelector(".kh > .badge")?.outerHTML ?? "" }; };
dock.addEventListener("pointerdown", (e) => {
  const tr = e.target.closest(".track");
  if (!tr || e.button !== 0) return;
  const el = tr.closest(".knob"), p = specOf(el);
  tr.setPointerCapture(e.pointerId); tr.classList.add("live"); shield(true);
  begin([storeOf(el.dataset.src)], knobLabel(el), knobD(el));
  setParam(el, trackAt(tr, p, e.clientX));
  let done = false;
  const move = (ev) => { if (ev.buttons === 0) return up(); setParam(el, trackAt(tr, p, ev.clientX)); };
  const up = () => {
    if (done) return; done = true; shield(false);
    commit(); tr.classList.remove("live");
    for (const [t, f] of [["pointermove", move], ["pointerup", up], ["pointercancel", up], ["lostpointercapture", up]]) tr.removeEventListener(t, f);
  };
  for (const [t, f] of [["pointermove", move], ["pointerup", up], ["pointercancel", up], ["lostpointercapture", up]]) tr.addEventListener(t, f);
});
dock.addEventListener("dblclick", (e) => { const el = e.target.closest(".knob"); if (el) txn([storeOf(el.dataset.src)], knobLabel(el), () => setParam(el, specOf(el).def), knobD(el)); });
dock.addEventListener("keydown", (e) => {
  const tr = e.target.closest?.(".track");
  if (!tr) return;
  const el = tr.closest(".knob"), p = specOf(el), cur = valOf(p, el.dataset.src);
  const next = { ArrowLeft: cur - p.step, ArrowDown: cur - p.step, ArrowRight: cur + p.step, ArrowUp: cur + p.step, Home: p.min, End: p.max }[e.key];
  if (next === undefined) return;
  e.preventDefault(); e.stopPropagation();
  txn([storeOf(el.dataset.src)], knobLabel(el), () => setParam(el, next), knobD(el));
});
addEventListener("keydown", (e) => {
  const tgt = e.composedPath()[0], typing = !!tgt.matches?.("input, textarea, [contenteditable]");
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); return sendAll(); }
  /* ⌘Z / Ctrl+Z 撤回，⇧⌘Z / Ctrl+Y 重做；正在打字时让给原生撤回 */
  const zk = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && !e.altKey && (zk === "z" || zk === "y") && !typing) { e.preventDefault(); return undo(zk === "y" || e.shiftKey); }
  if (e.metaKey || e.ctrlKey || e.altKey || typing) return;
  if (/^[0-9]$/.test(e.key) && Number(e.key) < R().list.length) return setV(Number(e.key));
  const k = e.key.toLowerCase(), n = R().list.length, np = PAGES_.length;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") return setV((selI() + (e.key === "ArrowRight" ? 1 : n - 1)) % n);
  if ((e.key === "ArrowUp" || e.key === "ArrowDown") && np > 1) { e.preventDefault(); return setPg((pg + (e.key === "ArrowDown" ? 1 : np - 1)) % np); }
  if (k === "s") return setSpec((spc() + (e.shiftKey ? PG().specs.length - 1 : 1)) % PG().specs.length);
  if (k === "r" && PG().rounds.length > 1) return setRound((rnd() + (e.shiftKey ? PG().rounds.length - 1 : 1)) % PG().rounds.length);
  if (k === "f") return setNoting(!noting);
  if (k === "c") return setView(view === "pair" ? "one" : "pair");
  if (k === "a") return setView(view === "all" ? "one" : "all");
  if (k === "g" && multi()) return setView(view === "pages" ? "one" : "pages");
  if (k === "m") { const i = CYCLE.findIndex(([a, b]) => a === flags.live && b === flags.build); return setFlags(...CYCLE[(i + 1) % CYCLE.length]); }
  if (k === "t") return nextTheme();
  if (k === "p") return render(true);
  if (k === "i") return toggleDock();
  if (e.key === "Escape") { if (openPop) return closePop(); hosts().forEach((h) => closeMenu(h.shadowRoot)); if (noting) setNoting(false); }
});

addEventListener("resize", () => { closePop(); applyZoom(); syncChrome(); placePins(); });
document.body.classList.toggle("dock-off", load("do", false));
applyTheme();
/* 题目没填就大声报错，不画空台子 */
if (!PAGES_.length || PAGES_.some((p) => !p.specs?.length || !p.rounds?.length || p.rounds.some((r) => !r.tile || !r.list?.length))) {
  stage.innerHTML = `<div class="lab-empty"><b>对照版还没填</b>：脚本第 ② 段的 PAGES 是空的（每个界面要有 specs ≥3 条样本与 rounds，每轮要有 tile 与 list）。写法见 morii-compare 的 SKILL.md ④。</div>`;
  throw new Error("对照版：PAGES 未填（或某界面缺 specs / rounds，某轮缺 tile / list）");
}
if (raw("sent") === null) save("sent", stateKey());   // 刚打开的样子算「发过」：没标注、没改动时发送键不亮
const re = sessionStorage.getItem(KEY + "re");
sessionStorage.removeItem(KEY + "re");
renderChrome(); renderHist(); render(!re);
if (re) { const [x, y] = JSON.parse(re); board.scrollTo(x, y); }
document.fonts.ready.then(placePins);
/* 对照版服务：agent 回话、文件改了就刷新；断了 EventSource 自己重连 */
if (SERVED) {
  const es = new EventSource("/__lab/events");
  es.addEventListener("state", (e) => hear(JSON.parse(e.data).say));
  es.addEventListener("say", (e) => hear(JSON.parse(e.data)));
  es.addEventListener("reload", reloadSoon);
}
</script>
