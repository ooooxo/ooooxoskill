<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>对照版 · TOPIC</title>
<!--
  干什么：TOPIC 的多档对照（morii-compare）。这页只放题目（第 ② 段）；台子（顶条 · 左右栏 · 舞台 · 标注 · 发送）从对照版服务的 /__lab/lab.js 取，不在页面里。
  怎么跑：lab.sh <项目根> 起服务，浏览器开它打印的地址 + /docs/lab/<topic>.html（见 SKILL.md ⑦）。直接双击文件打不开台子。
  需要什么：第一行 <link> 指向项目 token 源（只吃自定义属性，影子里照样继承）；第 ② 段写法见 morii-compare 的 SKILL.md ④。
-->
<link rel="stylesheet" href="../../src/styles/tokens.css">
<link rel="stylesheet" href="/__lab/lab.css">
<script src="/__lab/lab.js"></script>
</head>
<body>
<script type="module">
/* ================= ② 题目（只写这一段；写法见 morii-compare SKILL.md ④） =================
   这里故意是空的：样本、样式、档都由你按题目现写，别从别的对照页抄内容。没填就会在舞台上报错。
   这一段是自己的模块作用域，名字随便起，不会和台子撞。台子给的全局：
     ICON            图标表（台子自用几枚）；样本要用的从项目图标注册表抽出来补：Object.assign(ICON, { 名: "<path …/>" })，不手画
     ic(名, 尺寸)     画一枚图标
     pa(id, 名)       零件命名属性（可选，跨档同名 / ⌥ 抓整组用）：<button ${pa("send", "发送")}>
     part(id, 名, html, cls?)  给一组外面套一层具名壳 */
const TOPIC = "TOPIC";
const KEY = "lab.TOPIC.";   // localStorage 前缀，每个题目一个

/* 所有界面共用的样本样式（只进影子，不进台子；只吃 token 与 var(--p-*)）。界面自己的写界面 css，档自己的写档 css */
const CSS = ``;

/* 界面：比几个不同的界面就写几项（只比一个就写一项）。每个界面有自己的样本、自己的一套档——档的设计各界面各不相同。
   name    左栏界面清单上的名字
   specs   样本 ≥3 条（稀 / 中 / 满），照项目真 schema 抄形状；台子只读 from（顶条样本段控上的字）与 note
   css     这个界面所有档共用的样式（可不写）
   rounds  轮次，一轮一项、下一轮追加在末尾。每轮：
     name    轮名
     tile    { w, h } 每格多大：数字（px），或共用参数的 key（跟着滑块变）
     params  共用滑块 [{ key, label, min, max, step, tick, def, unit }] → 影子里 var(--p-<key>)；由你定，2–6 条
     pins    静态看法下可钉住的状态 [[id, 名], …]，配 pin(root, id, spec) 把样本摆成那样
     menu    (spec, btn) => [{ label, danger }]：带 data-menu 的按钮弹出的菜单
     on      (act, { root, spec, btn, log }) => void：带 data-act 的元素被点时的真行为（不写就只记一笔）
     figure  (v, d, box) => HTML：记录弹层顶上的示意图，v 当前值 / d 默认值（可不写）
     list    档 [{ name, thesis, parts: [[键, 值], …], cost, css, params, render(spec) => HTML }]，第一轮第 0 档 = 现状 */
const PAGES = [];

labStart({ TOPIC, KEY, CSS, PAGES });
</script>
</body>
</html>
