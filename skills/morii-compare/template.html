<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>对照版 · TOPIC</title>
<!--
  干什么：TOPIC 的多档对照（morii-compare 模板）。第 0 档 = 现状，1–N 档各一套完整方案。
         上下布局，生成的内容占满宽：顶条放所有切换（样本 / 看法 / 钉住 / 比例 / 明暗）与「记录」（交互动作 + 改动一条时间线），
         滑条栏放 agent 按题目定的滑块（轮次共用 + 选中档私有），用户只管拉。
         默认一次只看一档（单看，数字 / ← → 换档）；C 现状对选中，A 才平铺全部（自动算列数与比例，放不下保底比例滚动）——有必要才平铺。样本（稀 / 中 / 满）一次只看一条。
         台子与被比较物彻底分开：每格样本挂一个 Shadow DOM，档的样式只进自己的影子；台子控件照抄项目的
         SegControl（强调实心滑块）· ScaleTrack（刻度轨 + 带数游标 + 默认刻痕）· icons.ts · .ink-glass / .ink-kbd。
         看法 = 两颗开关，默认都开：交互（真点真用，滑条栏记动作）+ 拼装（零件框内按住拖）；都关 = 静态（可钉住状态）。
  怎么跑：/usr/bin/open 这个文件。数字选档 · S 样本 · M 轮换看法 · C 只看现状与选中档 · T 明暗（默认跟随系统）· I 收起滑条栏 ·
         R 轮次 · P 重播 · ⌘Z / Ctrl+Z 撤回、⇧⌘Z / Ctrl+Y 重做（不占界面，撤回过的记录变灰）。刻度轨可拖、可点、← → 微调，双击回默认。
  需要什么：下面 <link> 指向项目 token 源（只吃自定义属性，影子里照样继承）。改题目只动脚本第 ② 段（TOPIC / KEY / SPECS / CSS / ROUNDS），写法见 morii-compare 的 SKILL.md ④。
-->
<link rel="stylesheet" href="../../src/styles/tokens.css">
<!-- 首帧前先按系统明暗定底色（暗色系统不闪白）；存过的手选值由脚本随后接管 -->
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/* ---- 可调参数 ---------------------------------------------------------- */
:root {
    --top-h: 52px;     /* 顶条高（样本 / 看法 / 钉住） */
  --dock-w: 272px;   /* 左栏宽：上「档」清单 + 下滑条（agent 定的滑块）；I 键收起 */
  --gap: 10px;       /* 岛离窗边 */
  --grid: 16px;      /* 舞台点阵间距（拼装吸附 = 它的一半，见脚本 SNAP） */
}

/* ================= 台子（实验台自己，不是被比较的东西） ================= */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg-content); color: var(--ink-2); font: 13px/1.45 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
.ic { flex: none; display: block; }
.isl button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* 舞台：满铺点阵板；上给顶条两行、左给滑条栏留位置，格子永远不被压 */
.board { position: fixed; inset: 0; overflow: auto;
  padding: calc(var(--top-h) + var(--gap) + 12px) 0 calc(var(--gap) * 2) calc(var(--dock-w) + var(--gap) * 2);
  background: var(--bg-content) radial-gradient(circle, var(--sep-strong) 1px, transparent 1.2px) 0 0 / var(--grid) var(--grid);
  transition: padding-left var(--t-slow) var(--ease-out), background-color var(--t-slow) var(--ease-hover); }
body.dock-off .board { padding-left: 0; }

/* 玻璃：料照抄 base.css 的 .ink-glass（前端 ADR 0076），影用 --shadow-float */
.isl { z-index: 10; border-radius: var(--r-md); border: 0.5px solid var(--chin-edge); background: var(--chin-glass); box-shadow: var(--shadow-float);
  backdrop-filter: blur(var(--glass-blur)) saturate(1.4); -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
  -webkit-user-select: none; user-select: none; cursor: default;
  transition: transform var(--t-slow) var(--ease-out), opacity var(--t-fast) var(--ease-hover), background-color var(--t-slow) var(--ease-hover); }


/* 顶条横跨舞台；滑条栏贴左、竖着排 */
.lane { position: fixed; left: var(--gap); right: var(--gap); z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.lane.top { top: var(--gap); }
/* 左：滑条栏，从顶部两行下面一直到底（--side-top 由脚本按顶部实际高度写） */
.lane.side { top: var(--side-top, 72px); bottom: var(--gap); right: auto; width: var(--dock-w); align-items: stretch; gap: 10px; }
.bar { pointer-events: auto; display: flex; align-items: center; max-width: 100%; }
#topbar { width: 100%; height: var(--top-h); padding: 0 8px 0 14px; gap: 2px; }
#topbar .sp { flex: 1; }
/* 左栏顶：「档」清单——每档一行（编号章 + 名），选中那档就地展开：论点 · 零件（一行一对）· 代价 · 当前样本 */
#vlist { flex: 0 1 auto; min-height: 0; flex-direction: column; align-items: stretch; gap: 6px; padding: 10px 8px 8px; overflow-y: auto; scrollbar-width: none; }
#vlist::-webkit-scrollbar { display: none; }
.vh { display: flex; align-items: center; gap: 8px; padding: 0 4px 2px; }
.vh .sp { flex: 1; }
.vh .seg button { min-height: 26px; padding: 0 8px; font-size: 12px; }
.vl { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.vi { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 8px; padding: 6px 8px; border-radius: var(--r-sm); color: var(--ink-3); cursor: pointer;
  transition: background-color var(--t-fast) var(--ease-hover), color var(--t-fast) var(--ease-hover); }
.vi:hover { background: var(--hover); color: var(--ink); }
.vi.on { background: var(--hover); color: var(--ink); cursor: default; }
.vi > b { min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vi.on > b { font-weight: 700; }
.vd { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 9px; padding: 8px 0 4px; animation: in-up var(--t-slow) var(--ease-out); }
.vd > p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }
.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 12px; line-height: 1.45; }
.kv dt { color: var(--ink-4); white-space: nowrap; }
.kv dd { margin: 0; font-weight: 600; color: var(--ink); }
.vcost { display: flex; flex-direction: column; gap: 3px; padding: 8px 9px; border-radius: 9px; background: color-mix(in srgb, var(--warn) 11%, transparent); font-size: 12px; line-height: 1.55; color: var(--ink-2); }
.vcost .stamp { align-self: flex-start; }
.vspec { display: flex; align-items: flex-start; gap: 6px; font-size: 11.5px; line-height: 1.5; color: var(--ink-4); }
.vspec .tag { flex: none; }
/* 顶条不许把段控压扁：放不下先藏组名（键位章留着），再藏题目小字 */
#topbar > * { flex-shrink: 0; }
#topbar > .sp { flex-shrink: 1; }
@media (max-width: 1500px) { #topbar .gl { font-size: 0; gap: 0; } .brand small { display: none; } }
@media (max-width: 1340px) { .zr span, .togs .st { display: none; } .brand h1 { max-width: 120px; overflow: hidden; text-overflow: ellipsis; } #topbar .seg button, #topbar .togs button { padding: 0 6px; } #topbar .tg { padding: 0 4px; } }
.tg { display: flex; align-items: center; gap: 8px; padding: 0 8px; }
.gl { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
.gl .ink-kbd { min-width: 18px; height: 18px; font-size: 10px; }
/* 钉住只在静态时有：宽度收放，不突然出现 */
.pinw { max-width: 360px; opacity: 1; overflow: hidden; transition: max-width var(--t-slow) var(--ease-out), opacity var(--t-fast) var(--ease-hover), padding var(--t-slow) var(--ease-out); }
body:not([data-mode="static"]) .pinw { max-width: 0; opacity: 0; padding: 0; }
#dock { flex: none; flex-direction: column; align-items: stretch; max-height: 50%; padding: 12px 12px 14px; gap: 18px; overflow-y: auto; scrollbar-width: none; }
#dock::-webkit-scrollbar { display: none; }
body.dock-off .lane.side > .isl { transform: translateX(calc(-100% - var(--gap) * 2)); opacity: 0; pointer-events: none; }
.kgrp { flex: none; display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
.kgrp:empty { display: none; }
.dbtn { height: 34px; padding: 0 8px 0 10px; border-radius: var(--r-sm); display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--hover);
  transition: background-color var(--t-fast) var(--ease-hover), color var(--t-fast) var(--ease-hover), max-width var(--t-slow) var(--ease-out), opacity var(--t-fast) var(--ease-hover); }
.dbtn:hover, .dbtn.open { background: var(--hover-2); color: var(--ink); }
.dbtn .badge { min-width: 20px; height: 20px; font-size: 10.5px; }
.kh .tag, .kh .badge { min-width: 0; height: 18px; line-height: 18px; font-size: 10px; padding: 0 5px; border-radius: 5px; }
/* 记录弹层：顶上形状图（改后实面 vs 默认虚影），底下一行改动类动作 */
#histPop { width: 340px; }
#histPop .fig { width: auto; height: 116px; }
#histPop .fig-box { inset: 12px 14px 20px; }
#histPop .fig-dim { font-size: 10.5px; bottom: -16px; }
.hist time { margin-left: auto; font: 500 10.5px var(--font-mono); color: var(--ink-4); }
.hist li { gap: 7px; }
.hist .nm { flex: none; }
.hist li > .ic { flex: none; color: var(--ink-3); }
.hist .badge { min-width: 20px; height: 20px; font-size: 10.5px; }
.hist li.danger .nm { color: var(--crit); }
.hist li.undone { opacity: .45; }
.hist li.undone .nm { text-decoration: line-through; }
.chg .nm { flex: 0 1 auto; }
.pfoot { display: flex; gap: 6px; }
.mini { height: 28px; padding: 0 10px 0 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-3); background: var(--hover);
  transition: background-color var(--t-fast) var(--ease-hover), color var(--t-fast) var(--ease-hover); }
.mini:hover { background: var(--hover-2); color: var(--ink); }

/* 弹层（记录 / 键位）：从顶条往下长出来 */
.pop { position: fixed; z-index: 20; width: 300px; max-height: 50vh; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px;
  opacity: 0; transform: translateY(8px) scale(.98); transform-origin: bottom right; pointer-events: none; }
.pop.down { transform: translateY(-8px) scale(.98); transform-origin: top right; width: 260px; padding: 14px; }
.pop.open { opacity: 1; transform: none; pointer-events: auto; }

/* 节：图标 + 名 + 右侧等宽元信息 / 图标钮 */
.sh { display: flex; align-items: center; gap: 8px; min-height: 26px; padding-left: 2px; }
.sh > .ic { color: var(--ink-3); }
.sh h3 { flex: 1; margin: 0; font-size: 13px; font-weight: 650; color: var(--ink); }
.sh .meta { font: 500 11px var(--font-mono); color: var(--ink-4); }
.ibtn { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-3);
  transition: background-color var(--t-fast) var(--ease-hover), color var(--t-fast) var(--ease-hover), transform var(--t-press) var(--ease-out); }
.ibtn:hover { background: var(--hover-2); color: var(--ink); }
.ibtn:active { transform: scale(var(--press)); }
.ibtn.ok { color: var(--accent); }
.ibtn.err { color: var(--crit); }

/* 编号章：等宽实心小章，选中填强调色（ParamField / SegControl 的「强调实心」） */
.badge { flex: none; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 7px; display: inline-grid; place-items: center;
  font: 650 11.5px/1 var(--font-mono); background: var(--hover-2); color: var(--ink-3);
  transition: background-color var(--t-med) var(--ease-hover), color var(--t-med) var(--ease-hover); }
.on > .badge, .badge.on { background: var(--accent); color: var(--on-accent); }
.tag { flex: none; font: 500 10.5px/18px var(--font-mono); padding: 0 6px; border-radius: 6px; background: var(--hover-2); color: var(--ink-3); }

/* 开关组（交互 / 拼装各自独立开关，都关 = 静态）：开着的那颗强调实心 */
.togs { display: flex; gap: 2px; padding: 2px; border-radius: var(--r-sm); background: var(--hover); }
.togs button { min-height: 30px; padding: 0 10px; border-radius: var(--r-xs); display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); white-space: nowrap;
  transition: background-color var(--t-med) var(--ease-hover), color var(--t-med) var(--ease-hover), transform var(--t-press) var(--ease-out); }
.togs button:hover { background: var(--hover-2); color: var(--ink); }
.togs button:active { transform: scale(var(--press)); }
.togs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 650; }
.togs .st { font: 600 11px/1 var(--font-mono); padding: 0 8px; display: inline-flex; align-items: center; color: var(--ink-4); transition: color var(--t-fast) var(--ease-hover); }
body[data-mode="static"] .togs .st { color: var(--warn); }
/* 段控：照抄 SegControl 默认款——一条轨道，强调色块滑到选中那格 */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px; border-radius: var(--r-sm); background: var(--hover); }
.seg .thumb { position: absolute; top: 0; left: 0; border-radius: var(--r-xs); background: var(--accent); pointer-events: none; }
.seg.moving .thumb { transition: transform var(--t-med) var(--ease-in-out), width var(--t-med) var(--ease-in-out), height var(--t-med) var(--ease-in-out); }
.seg button { position: relative; min-width: 0; min-height: 30px; padding: 0 10px; border-radius: var(--r-xs); color: var(--ink-3); font-size: 13px; white-space: nowrap;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background-color var(--t-fast) var(--ease-hover), color var(--t-fast) var(--ease-hover), transform var(--t-press) var(--ease-out); }
.seg button[aria-pressed="true"] { color: var(--on-accent); font-weight: 650; }
.seg button:not([aria-pressed="true"]):hover { background: var(--hover-2); color: var(--ink); }
.seg button:active:not([aria-pressed="true"]) { transform: scale(var(--press)); }
/* 次要段控（钉住 / 比例 / 明暗）：色块是浮起的一片面板，不抢主键的强调色 */
.seg.sub .thumb { background: var(--bg-content); box-shadow: var(--shadow-sm); }
.seg.sub button[aria-pressed="true"] { color: var(--ink); }
/* 密度字形：稀一根、中两根、满四根 */
.dens { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.dens i { width: 3px; border-radius: 1.5px; background: currentColor; }
.dens i:nth-child(1) { height: 6px; } .dens i:nth-child(2) { height: 12px; } .dens i:nth-child(3) { height: 9px; } .dens i:nth-child(4) { height: 12px; }



/* 左岛 */
.brand { flex: none; display: flex; flex-direction: column; gap: 0; padding-right: 14px; }
.ibtn.open { background: var(--hover-2); color: var(--ink); }


.brand small { font: 500 10.5px var(--font-mono); color: var(--ink-4); }
.brand h1 { margin: 0; font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }

.pts { display: flex; flex-wrap: wrap; gap: 4px; }
.pt { display: inline-flex; height: 22px; border-radius: 7px; overflow: hidden; font-size: 11.5px; line-height: 22px; }
.pt i { font-style: normal; padding: 0 6px; background: var(--hover-2); color: var(--ink-3); }
.pt b { font-weight: 550; padding: 0 7px; background: var(--hover); color: var(--ink); }
.cost { margin: 0; display: flex; gap: 6px; align-items: flex-start; font-size: 12px; line-height: 1.5; color: var(--ink-2); }
.stamp { flex: none; font: 650 10.5px/18px var(--font); padding: 0 6px; border-radius: 6px; background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; font-size: 11.5px; color: var(--ink-3); }
.ink-kbd { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 6px; background: var(--hover-2); display: inline-flex; align-items: center; justify-content: center;
  font: 600 10.5px var(--font-mono); color: var(--ink-2); }

/* 刻度轨：照抄 ScaleTrack——每 tick 一道刻度，走过的染强调色，默认值下一粒刻痕，游标是带数的强调实心章 */
.knob { flex: none; width: 100%; display: flex; flex-direction: column; gap: 5px; }
.kh { display: flex; align-items: center; gap: 6px; padding: 0 2px; min-height: 18px; white-space: nowrap; }
.kh .nm { flex: 1; font-size: 12.5px; color: var(--ink-2); }
.kh .dl { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px var(--font-mono); color: var(--ink-4);
  opacity: 0; transform: translateX(4px); transition: opacity var(--t-fast) var(--ease-hover), transform var(--t-med) var(--ease-out); }
.knob.dirty .kh .dl { opacity: 1; transform: none; }
.kh .dl b { font-weight: 650; color: var(--ink); }
.kh .dl em { font-style: normal; font-weight: 650; padding: 0 5px; border-radius: 5px; line-height: 17px;
  background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-ink); }
.kh .unit { font: 500 11px var(--font-mono); color: var(--ink-4); }
.track { --pad: 20px; position: relative; height: 32px; padding: 0 var(--pad); border-radius: var(--r-sm); background: var(--hover); cursor: pointer; touch-action: none; outline: none; }
.track:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tick { position: absolute; top: 50%; width: 2px; height: 8px; margin-left: -1px; translate: 0 -50%; border-radius: 1px; background: var(--sep-strong); transition: background-color var(--t-fast) var(--ease-hover); }
.tick.end { height: 12px; }
.tick.on { background: var(--accent); }
.notch { position: absolute; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 2px; background: var(--ink-3); }
.trk { position: absolute; top: 0; bottom: 0; left: var(--pad); right: var(--pad); pointer-events: none; transition: translate var(--t-fast) var(--ease-out); }
.track.live .trk { transition: none; }
.cur { position: absolute; left: 0; top: 50%; translate: -50% -50%; height: 26px; min-width: 40px; padding: 0 8px; border-radius: var(--r-xs); background: var(--accent); color: var(--on-accent);
  font: 650 13px var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; display: grid; place-items: center; box-shadow: var(--shadow-sm); transition: scale var(--t-press) var(--ease-out); }
.track.live .cur { scale: 1.06; }

/* 形状图：当前值的面（实）+ 默认值的面（虚影）+ 内距框 + 标题条 + 键条 */
.fig { flex: none; position: relative; width: 112px; height: 68px; border-radius: var(--r-sm); background: var(--hover); overflow: hidden; }
.fig-box { position: absolute; inset: 7px 8px 16px; }
.fig i { position: absolute; display: block; }
/* figure() 用的两枚：.fig-ghost = 默认值的虚影，.fig-face = 当前值的实面；其余细节写 inline style */
.fig-ghost { z-index: 2; border-radius: 6px; border: 1px dashed var(--ink-3); opacity: .7; pointer-events: none; transition: all var(--t-med) var(--ease-out); }
.fig-face { border-radius: 6px; background: var(--panel-strong); box-shadow: var(--shadow-sm); transition: all var(--t-med) var(--ease-out); }
.fig-dim { position: absolute; right: 0; bottom: -14px; font: 600 9.5px var(--font-mono); color: var(--ink-3); white-space: nowrap; }

/* 改动清单：名 · 改前 → 改后 · 增量；布局一行两枚坐标章 */
.chg { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.chg li { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 10px; border-radius: 9px; background: var(--hover); animation: in-up var(--t-slow) var(--ease-out) backwards; }
.chg .nm { flex: 1; min-width: 0; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chg .was { font: 500 12px var(--font-mono); color: var(--ink-4); }
.chg .arr { color: var(--ink-4); font-size: 11px; }
.chg .now { font: 650 12px var(--font-mono); color: var(--ink); }
.chg em { font: normal 650 11px/17px var(--font-mono); padding: 0 5px; border-radius: 5px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-ink); }
.chg .xy { font: 600 11px/18px var(--font-mono); padding: 0 6px; border-radius: 6px; background: var(--hover-2); color: var(--ink-2); }
.chg li.empty { background: none; color: var(--ink-3); padding: 0 2px; }
.chg li.empty .ic { color: var(--accent); }

/* 比例读数：大号等宽百分比 + 列 × 行 */
.zr { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.zr b { font: 700 15px/1 var(--font-mono); color: var(--ink); }
.zr span { font-size: 11.5px; color: var(--ink-3); }
.zr span.warn { color: var(--warn); }

/* 动作记录：编号章 + 样本章 + 动作 + 等宽时刻 */
.log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.log li { display: flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 8px 0 5px; border-radius: 9px; background: var(--hover); color: var(--ink-2);
  animation: in-up var(--t-slow) var(--ease-out) backwards; }
.log .badge { min-width: 20px; height: 20px; font-size: 10.5px; }
.log li.danger .act { color: var(--crit); }
.log .act { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log time { font: 500 10.5px var(--font-mono); color: var(--ink-4); }
.log li.empty { background: none; color: var(--ink-3); padding: 0 2px; }

/* 平铺：列数与比例由脚本按舞台大小算（--cols / --zoom），间距与内边距和脚本里 GAP / PAD 一致 */
.stage { zoom: var(--zoom, 1); display: grid; grid-template-columns: repeat(var(--cols, 3), var(--tile-w)); gap: 28px; padding: 24px 32px 32px; width: max-content; margin: 0 auto; }
.tile { display: flex; flex-direction: column; gap: 10px; animation: in-up var(--t-slow) var(--ease-out) backwards; animation-delay: var(--d, 0ms); }
.tile .lbl { height: 22px; display: flex; align-items: center; gap: 8px; padding: 0; border: 0; background: none; font: 500 13.5px var(--font);
  color: var(--ink-3); text-align: left; cursor: pointer; -webkit-user-select: none; user-select: none; transition: color var(--t-fast) var(--ease-hover); }
.tile .lbl:hover { color: var(--ink); }
body[data-view="one"] .tile .lbl { display: none; }   /* 单看：档名已在题签里 */
.tile.sel .lbl { color: var(--ink); font-weight: 650; }
.host { display: flex; }
.lab-empty { margin: 80px auto; max-width: 520px; padding: 18px 20px; border-radius: var(--r-md); background: color-mix(in srgb, var(--crit) 10%, transparent); color: var(--ink); font-size: 13px; line-height: 1.6; }
.lab-empty b { color: var(--crit); }

@keyframes in-up { from { opacity: 0; transform: translateY(6px); } }

/* 轮次。每轮：
   name    轮名
   tile    { w, h } 每格多大：数字（px），或共用参数的 key（跟着滑块变）
   params  共用滑块 [{ key, label, min, max, step, tick, def, unit }] → 影子里 var(--p-<key>)；由你定，2–6 条
   pins    静态看法下可钉住的状态 [[id, 名], …]，配 pin(root, id, spec) 把样本摆成那样
   menu    (spec, btn) => [{ label, danger }]：带 data-menu 的按钮弹出的菜单
   on      (act, { root, spec, btn, log }) => void：带 data-act 的按钮被点时的真行为（不写就只记一笔）
   figure  (v, d, box) => HTML：记录弹层顶上的示意图，v 当前值 / d 默认值（可不写）
   list    档 [{ name, thesis, parts: [[键, 值], …], cost, css, params, render(spec) => HTML }]，第一轮第 0 档 = 现状 */
const ROUNDS = [];

/* ================= ③ 台子（不用改） ================= */
/* 台子给每格影子的底：尺寸、根、壳、名牌、菜单、看法（样本自己的样式在 ② 的 CSS 与各档 css） */
const CHROME_CSS = `
:host { flex: none; display: flex; width: var(--tile-w); height: var(--tile-h); color: var(--ink); font-family: var(--font); -webkit-user-select: text; user-select: text; cursor: auto; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
.ic { flex: none; display: block; }
.root { position: relative; flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
:host([data-mode="static"]) .root * { pointer-events: none; }   /* 静态：样本不响应，根留着接点击（选档） */
:host(.dragging) { -webkit-user-select: none; user-select: none; cursor: grabbing; }
.shell { position: relative; border-radius: 10px; transition: background-color var(--t-fast) var(--ease-hover), box-shadow var(--t-fast) var(--ease-hover); }
:host([data-mode~="build"]) .shell { cursor: grab; }
:host([data-mode~="build"]) .shell:hover, .shell.drag { background: color-mix(in srgb, var(--accent) 7%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 32%, transparent); }
.shell.drag { cursor: grabbing; z-index: 25; box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), var(--shadow-md); }
.pn { position: absolute; right: 6px; top: 0; translate: 0 -50%; z-index: 30; height: 16px; padding: 0 5px; border-radius: 5px; pointer-events: none;
  font: 600 9.5px/16px var(--font-mono); white-space: nowrap; background: var(--accent); color: var(--on-accent); opacity: 0; transition: opacity var(--t-fast) var(--ease-hover); }
:host([data-mode~="build"]) .shell:hover > .pn, .shell.drag > .pn { opacity: 1; }
/* 改大小：右下角一枚拉手，拼装开着、悬停才露；拉过的零件内容撑满壳 */
.sz { position: absolute; right: -5px; bottom: -5px; z-index: 31; width: 12px; height: 12px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 0 2px var(--bg-content);
  cursor: nwse-resize; touch-action: none; opacity: 0; pointer-events: none; transition: opacity var(--t-fast) var(--ease-hover), transform var(--t-press) var(--ease-out); }
:host([data-mode~="build"]) .shell:hover > .sz, .shell.drag > .sz { opacity: 1; pointer-events: auto; }
.sz:active { transform: scale(1.2); }
.shell.sized { transition: width var(--t-med) var(--ease-out), height var(--t-med) var(--ease-out), background-color var(--t-fast) var(--ease-hover), box-shadow var(--t-fast) var(--ease-hover); }
.shell.sized.drag { transition: none; }
.shell.sized > :not(.pn):not(.sz) { width: 100%; height: 100%; }
.menu { position: absolute; z-index: 40; min-width: 150px; padding: 4px; border-radius: var(--r-sm); background: var(--panel); box-shadow: var(--shadow-md), 0 0 0 1px var(--sep);
  display: flex; flex-direction: column; animation: menu-in var(--t-fast) var(--ease-out); }
.menu button { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 0; border-radius: var(--r-xs); background: none; font-size: var(--fs-label); color: var(--ink-2); text-align: left; }
.menu button:hover { background: var(--hover); color: var(--ink); }
.menu button.danger { color: var(--crit); }
@keyframes menu-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
`;

/* 看法 = 两颗独立开关，默认都开；都关 = 静态（样本不响应指针，可钉住悬停 / 菜单开来对照） */
const FLAGS = [
  ["live", "交互", "play", "真点真用：按钮、⋯ 菜单、编辑都能用，每一下进「记录」；拉刻度轨不重画，开着的菜单不会被冲掉"],
  ["build", "拼装", "grid-view", "零件框内任意处按住拖动（过 4px 才算拖，轻点照常点按钮），右下角拉手改大小；吸 8px 格，Shift 不吸，双击框归位"],
];
const DRAG_PX = 4;
const SNAP = 8;
const SPRING = { k: 420, z: 0.78 };
const GAP = 28, PAD_X = 32, PAD_Y = 16 + 24, LBL = 32;   // 与 .stage / .tile 的 CSS 一致
const MIN_Z = 0.6;     // 平铺缩到这以下就算「放不下」：保底这个比例，按宽排列、纵向滚动
const MERGE_MS = 500;  // 同一项改动连着来（双击回默认、连按方向键）并成一条记录 / 一步撤回

/* 弹簧（k 刚度、z 阻尼比，dt 钳在 1/30） */
const step = (p, to, { k, z }, dt) => { p.v += (-k * (p.x - to) - 2 * z * Math.sqrt(k) * p.v) * dt; p.x += p.v * dt; };
let raf = 0, lastT = 0;
const anims = new Set();
function frame(t) {
  raf = 0;
  const dt = Math.min(1 / 30, Math.max(0, (t - lastT) / 1000));
  lastT = t;
  let busy = false;
  for (const a of anims) busy = a.tick(dt) || busy;
  if (busy) raf = requestAnimationFrame(frame);
}
function kick() { if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); } }

/* 状态 */
const load = (k, d) => { const v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); };
const save = (k, v) => localStorage.setItem(KEY + k, JSON.stringify(v));
const raw = (k) => localStorage.getItem(KEY + k);
let round = Math.min(load("r", ROUNDS.length - 1), ROUNDS.length - 1);
const sel = ROUNDS.map((_, i) => load("v" + i, i === 0 ? 1 : 0));
let spec = Math.min(load("s", 1), SPECS.length - 1);
let view = load("w", "one");   // 看几档：one = 单看选中档（默认）· pair = 现状对选中（C）· all = 平铺全部（A）——有必要才平铺
const flags = load("f", { live: true, build: true });
const modeStr = () => FLAGS.filter(([id]) => flags[id]).map(([id]) => id).join(" ") || "static";
const isStatic = () => !flags.live && !flags.build;
let pinned = "rest";
let fit = load("z", true);
let zoom = 1, cols = 1;
const pos = {};       // { "轮.档": { 零件: {x, y} } }
const settling = new Map();
const history = [];   // 记录：交互动作（act）与改动（chg）按时间混排；撤回 / 重做只认 chg

const $ = (id) => document.getElementById(id);
const stage = $("stage"), board = document.querySelector(".board");
const R = () => ROUNDS[round];
const S = () => SPECS[spec];
const vk = (r, i) => r + "." + i;
const selV = () => R().list[sel[round]];
const selK = () => vk(round, sel[round]);
/* 舞台上的格：单看 = 只有选中档；对照 = 现状（第一轮第 0 档）+ 选中档；平铺 = 本轮全部档 */
const tiles = () => {
  const all = R().list.map((v, i) => ({ r: round, i, v }));
  if (view === "all") return all;
  const one = all[sel[round]];
  return view === "one" || (round === 0 && sel[0] === 0) ? [one] : [{ r: 0, i: 0, v: ROUNDS[0].list[0] }, one];
};
const hosts = () => [...stage.querySelectorAll(".host")];
const hostOf = (k) => stage.querySelector(`.host[data-vk="${k}"]`);
const varOf = (k) => { const [r, i] = k.split(".").map(Number); return ROUNDS[r].list[i]; };
const shared = () => load("ps" + round, {});
const own = (k) => load("pv" + k, {});
/* 参数来源：s = 轮次共用，o = 档私有（读选中档的那份） */
const specBy = (src, key) => (src === "s" ? R().params ?? [] : selV().params ?? []).find((x) => x.key === key);
const specOf = (el) => specBy(el.dataset.src, el.dataset.k);
const valOf = (p, src) => (src === "o" ? own(selK()) : shared())[p.key] ?? p.def;
const storeOf = (src) => (src === "o" ? "pv" + selK() : "ps" + round);
/* 选中档的全部参数：当前值与默认值各一份（形状图、拷 JSON 用） */
function values() {
  const v = {}, d = {};
  for (const p of R().params ?? []) { v[p.key] = valOf(p, "s"); d[p.key] = p.def; }
  for (const p of selV().params ?? []) { v[p.key] = valOf(p, "o"); d[p.key] = p.def; }
  return { v, d };
}

/* ---- 小件 ---- */
const sh = (icon, title, meta = "", act = "") => `${ic(icon, 16)}<h3>${title}</h3>${meta}${act}`;
const ibtn = (id, icon, label) => `<button class="ibtn" id="${id}" title="${label}" aria-label="${label}">${ic(icon, 15)}</button>`;
const dens = (i) => `<span class="dens">${"<i></i>".repeat([1, 2, 4][i] ?? i + 1)}</span>`;
const hms = (d) => [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, "0")).join(":");
const signed = (d) => (d > 0 ? "+" : "−") + +Math.abs(d).toFixed(4);
/* 段控：渲染一次，之后只改 aria-pressed 再 segSync（色块滑过去） */
const seg = (el, items) => { el.innerHTML = `<i class="thumb"></i>` + items.map(([attr, val, html]) => `<button ${attr}="${val}">${html}</button>`).join(""); };
function segSync(el) {
  const t = el.querySelector(".thumb"), b = el.querySelector('button[aria-pressed="true"]');
  if (!t) return;
  el.classList.toggle("moving", t.dataset.ready === "1");
  t.style.opacity = b ? 1 : 0;
  if (!b) return;
  t.style.width = b.offsetWidth + "px"; t.style.height = b.offsetHeight + "px";
  t.style.transform = `translate(${b.offsetLeft}px, ${b.offsetTop}px)`;
  t.dataset.ready = "1";
}
const press = (sel_, test) => document.querySelectorAll(sel_).forEach((b) => b.setAttribute("aria-pressed", String(test(b))));

/* ---- 参数：共用的写在舞台上，档私有的写在各自的格上（影子继承） ---- */
/* 每格尺寸：tile 里写数字，或写共用参数的 key */
const tileWH = () => Object.fromEntries(["w", "h"].map((a) => { const x = R().tile[a]; return [a, typeof x === "number" ? x : valOf(specBy("s", x), "s")]; }));
function applyParams() {
  const sv = shared(), t = tileWH();
  stage.style.cssText = [`--tile-w: ${t.w}px`, `--tile-h: ${t.h}px`, ...(R().params ?? []).map((p) => `--p-${p.key}: ${sv[p.key] ?? p.def}${p.unit}`)].join(";");
  for (const h of hosts()) {
    const ov = own(h.dataset.vk);
    h.style.cssText = (varOf(h.dataset.vk).params ?? []).map((p) => `--p-${p.key}: ${ov[p.key] ?? p.def}${p.unit}`).join(";");
  }
  applyZoom();
  if (openPop === "histPop") renderFig();
}
/* 平铺：试每种列数，取比例最大的那种（不放大；同比例取列多的）；最大也低于 MIN_Z 就保底 MIN_Z 并滚动 */
function applyZoom() {
  const topB = document.querySelector(".lane.top").getBoundingClientRect().bottom + 12;
  board.style.paddingTop = topB + "px";   // 题签换行变高时舞台跟着让，不压格子
  document.documentElement.style.setProperty("--side-top", topB + "px");   // 左侧滑条栏从顶部两行下面开始
  const n = stage.querySelectorAll(".tile").length || 1;
  const { w: fw, h } = tileWH(), th = h + (view === "one" ? 0 : LBL);
  const cs = getComputedStyle(board);
  const W = board.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), H = board.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let best = { z: 0, c: 1 };
  for (let c = 1; c <= n; c++) {
    const rows = Math.ceil(n / c);
    const z = Math.min(1, W / (c * fw + (c - 1) * GAP + 2 * PAD_X), H / (rows * th + (rows - 1) * GAP + PAD_Y));
    if (z >= best.z - 1e-6) best = { z, c };
  }
  const colsAt = (z) => Math.max(1, Math.min(n, Math.floor((W / z - 2 * PAD_X + GAP) / (fw + GAP))));
  let over = false;
  if (!fit) best = { z: 1, c: colsAt(1) };
  else if (best.z < MIN_Z) { best = { z: MIN_Z, c: colsAt(MIN_Z) }; over = true; }
  zoom = best.z; cols = best.c;
  document.documentElement.style.setProperty("--zoom", zoom);
  document.documentElement.style.setProperty("--cols", cols);
  $("zoomv").textContent = Math.round(zoom * 100) + "%";
  const zn = $("zoomn");
  zn.textContent = over ? "放不下，滚动看" : !fit ? "实际尺寸" : n === 1 ? "单看" : `${cols} 列 × ${Math.ceil(n / cols)} 行`;
  zn.classList.toggle("warn", over);
}
function renderFig() {
  const box = $("fig"), { v, d } = values();
  box.parentElement.hidden = !R().figure;
  if (R().figure) box.innerHTML = R().figure(v, d, { w: box.clientWidth, h: box.clientHeight });
}

/* ---- 刻度轨（照抄 ScaleTrack）：拖、点、← → Home End，双击回默认；只改变量不重画 ---- */
const frac = (p, v) => (v - p.min) / (p.max - p.min);
const at = (f) => `left:calc(var(--pad) + (100% - var(--pad) * 2) * ${f})`;
function knobHTML(p, src) {
  const scope = src === "s" ? `<span class="tag">共用</span>` : `<span class="badge on">${sel[round]}</span>`;
  const tick = p.tick ?? p.step, n = Math.round((p.max - p.min) / tick);
  const ticks = Array.from({ length: n + 1 }, (_, i) => `<span class="tick${i === 0 || i === n ? " end" : ""}" data-tk="${p.min + i * tick}" style="${at(i / n)}"></span>`).join("");
  return `<div class="knob" data-k="${p.key}" data-src="${src}">
    <div class="kh">${scope}<span class="nm">${p.label} <span class="unit">${p.unit}</span></span><span class="dl"></span></div>
    <div class="track" tabindex="0" role="slider" aria-label="${p.label}" aria-valuemin="${p.min}" aria-valuemax="${p.max}">${ticks}<span class="notch" style="${at(frac(p, p.def))}"></span><span class="trk"><b class="cur"></b></span></div>
  </div>`;
}
function paintKnob(el, val) {
  const p = specOf(el), d = val - p.def;
  el.classList.toggle("dirty", d !== 0);
  el.querySelector(".dl").innerHTML = `<span>${p.def}</span><span class="arr">→</span><b>${val}</b><em>${signed(d)}</em>`;
  el.querySelectorAll(".tick").forEach((t) => t.classList.toggle("on", Number(t.dataset.tk) <= val + 1e-9));
  el.querySelector(".trk").style.translate = `${frac(p, val) * 100}% 0`;
  el.querySelector(".cur").textContent = val;
  el.querySelector(".track").setAttribute("aria-valuenow", val);
}
/* 滑条栏：滑块由 agent 写页面时决定（轮次 params 共用 + 档 params 私有），用户只管拉；选中档换了，私有那几条跟着换 */
function renderKnobs() {
  $("knobs").innerHTML = (R().params ?? []).map((p) => knobHTML(p, "s")).join("") + (selV().params ?? []).map((p) => knobHTML(p, "o")).join("");
  document.querySelectorAll(".knob").forEach((el) => paintKnob(el, valOf(specOf(el), el.dataset.src)));
}
function setParam(el, val) {
  const p = specOf(el);
  val = +Math.min(p.max, Math.max(p.min, Math.round((val - p.min) / p.step) * p.step + p.min)).toFixed(4);
  const store = storeOf(el.dataset.src), o = load(store, {});
  if (o[p.key] === val || (o[p.key] === undefined && val === p.def)) return;
  if (val === p.def) delete o[p.key]; else o[p.key] = val;
  save(store, o);
  paintKnob(el, val);
  applyParams();
}
function trackAt(tr, p, x) {
  const r = tr.getBoundingClientRect(), pad = parseFloat(getComputedStyle(tr).paddingLeft);
  return p.min + Math.min(1, Math.max(0, (x - r.left - pad) / (r.width - pad * 2))) * (p.max - p.min);
}

/* ---- 记录 + 撤回：每次改动前后各拍一张相关存储键的快照，记成一条 chg；撤回不占界面，⌘Z / ⇧⌘Z 走这里 ---- */
let pending = null;
function begin(keys, label, d = { type: "misc" }) { pending = { label, d, before: Object.fromEntries(keys.map((k) => [k, raw(k)])) }; }
function commit() {
  if (!pending) return;
  const { label, d, before } = pending;
  pending = null;
  const after = Object.fromEntries(Object.keys(before).map((k) => [k, raw(k)]));
  if (Object.keys(before).every((k) => before[k] === after[k])) return;
  for (let i = history.length - 1; i >= 0; i--) if (history[i].undone) history.splice(i, 1);   // 撤回过的再也够不着了，拿掉
  const last = history.findLast((h) => h.kind === "chg"), now = performance.now();
  if (last && last.label === label && now - last.ts < MERGE_MS && Object.keys(before).every((k) => k in last.before)) Object.assign(last, { after, ts: now, t: new Date() });
  else history.push({ kind: "chg", label, d, before, after, ts: now, t: new Date(), undone: false });
  renderHist();
}
const txn = (keys, label, fn, d) => { begin(keys, label, d); fn(); commit(); };
function restore(snap) {
  const moves = [];
  for (const [k, v] of Object.entries(snap)) {
    if (k.startsWith("L")) moves.push([k.slice(1), JSON.parse(raw(k) ?? "{}"), v === null ? {} : JSON.parse(v)]);
    if (v === null) localStorage.removeItem(KEY + k); else localStorage.setItem(KEY + k, v);
  }
  applyParams(); renderKnobs();
  for (const [k, cur, to] of moves) for (const id of new Set([...Object.keys(cur), ...Object.keys(to), ...Object.keys(pos[k] ?? {})])) {
    settle(k, id, { x: to[id]?.x ?? 0, y: to[id]?.y ?? 0 });
    setSize(k, id, to[id]?.w ?? null, to[id]?.h ?? null);
  }
}
function undo(redo = false) {
  const e = redo ? history.find((h) => h.kind === "chg" && h.undone) : history.findLast((h) => h.kind === "chg" && !h.undone);
  if (!e) return;
  restore(redo ? e.after : e.before);
  e.undone = !redo;
  renderHist();
}
function logAct(i, act, danger = false) { history.push({ kind: "act", i, from: S().from, act, danger, t: new Date() }); renderHist(); }
/* 一条记录长什么样：字形 + 章 + 名 + 改前 → 改后 / 坐标章 + 等宽时刻；撤回过的变灰 */
function rowHTML(h) {
  const tm = `<time>${hms(h.t)}</time>`, un = h.undone ? `<span class="tag">已撤回</span>` : "";
  if (h.kind === "act") return `<li class="${h.danger ? "danger" : ""}">${ic("play", 13)}<span class="badge">${h.i}</span><span class="tag">${h.from}</span><span class="nm">${h.act}</span>${tm}</li>`;
  const cls = h.undone ? "undone" : "";
  if (h.d.type === "param") {
    const get = (snap) => JSON.parse(snap[h.d.store] ?? "{}")[h.d.key] ?? h.d.def;
    const a = get(h.before), b = get(h.after);
    return `<li class="${cls}">${ic("sliders", 13)}${h.d.scope}<span class="nm">${h.label}</span><span class="was">${a}</span><span class="arr">→</span><span class="now">${b}</span><em>${signed(b - a)}</em>${un}${tm}</li>`;
  }
  if (h.d.type === "move" || h.d.type === "size") {
    const q = JSON.parse(h.after["L" + h.d.k] ?? "{}")[h.d.id] ?? {};
    const xy = h.d.type === "size" ? (q.w != null ? `<span class="xy">w ${q.w}</span><span class="xy">h ${q.h}</span>` : "") : (q.x || q.y ? `<span class="xy">x ${q.x ?? 0}</span><span class="xy">y ${q.y ?? 0}</span>` : "");
    return `<li class="${cls}">${ic("grid-view", 13)}<span class="badge">${h.d.k.split(".")[1]}</span><span class="nm">${h.label}</span>${xy || `<span class="xy">原样</span>`}${un}${tm}</li>`;
  }
  return `<li class="${cls}">${ic("pen", 13)}<span class="nm">${h.label}</span>${un}${tm}</li>`;
}
function renderHist() {
  const n = history.filter((h) => !h.undone).length;
  $("histT").innerHTML = `${ic("list-ordered", 15)}记录<span class="badge${n ? " on" : ""}">${n}</span>`;
  $("histH").innerHTML = sh("list-ordered", "记录", `<span class="meta">${n} 条</span>`, ibtn("copyJ", "export", "拷选中档的参数与布局 JSON"));
  $("hist").innerHTML = history.length ? [...history].reverse().map(rowHTML).join("") : `<li class="empty">还没有记录：点样本、拉滑块、挪零件，每一下都记在这里</li>`;
}
function copyJSON(btn) {
  const { v } = values();

/* ---- 拼装：位移写在壳的 translate 上、大小写在壳的 width / height 上，按档各存各的 L<轮.档> = { 零件: { x, y, w, h } } ---- */
function putL(L, id, patch) {   // 合进一个零件的布局；位移归零、大小置空的字段拿掉，空了整条拿掉
  const q = { ...L[id], ...patch };
  for (const a of ["x", "y"]) if (!q[a]) delete q[a];
  for (const a of ["w", "h"]) if (q[a] == null) delete q[a];
  if (Object.keys(q).length) L[id] = q; else delete L[id];
  return L;
}
function setSize(k, id, w, h) {
  const host = hostOf(k);
  if (host) for (const el of host.shadowRoot.querySelectorAll(`.shell[data-part="${id}"]`)) {
    el.classList.toggle("sized", w != null);
    el.style.width = w == null ? "" : w + "px"; el.style.height = h == null ? "" : h + "px";
  }
}
function setPos(k, id, x, y) {
  (pos[k] ??= {})[id] = { x, y };
  const h = hostOf(k);
  if (h) for (const el of h.shadowRoot.querySelectorAll(`.shell[data-part="${id}"]`)) el.style.translate = `${x}px ${y}px`;
}
function saveLayout(k) {
  const L = load("L" + k, {});
  for (const [id, p] of Object.entries(pos[k] ?? {})) putL(L, id, { x: Math.round(p.x), y: Math.round(p.y) });
  save("L" + k, L);
}
function settle(k, id, to) {
  const sk = k + "|" + id;
  settling.get(sk)?.stop();
  const from = pos[k]?.[id] ?? { x: 0, y: 0 };
  const sx = { x: from.x, v: 0 }, sy = { x: from.y, v: 0 };
  const a = {
    tick(dt) {
      step(sx, to.x, SPRING, dt); step(sy, to.y, SPRING, dt);
      const done = Math.abs(sx.x - to.x) < 0.3 && Math.abs(sy.x - to.y) < 0.3 && Math.abs(sx.v) + Math.abs(sy.v) < 8;
      setPos(k, id, done ? to.x : sx.x, done ? to.y : sy.x);
      if (done) { a.stop(); saveLayout(k); }
      return !done;
    },
    stop() { anims.delete(a); settling.delete(sk); },
  };
  settling.set(sk, a); anims.add(a); kick();
}
/* 框内按下先「待拖」：过 DRAG_PX 才接管成拖动（抓指针、关菜单、禁选字），没过就当普通一点 */
let swallow = false;
function armDrag(e, shell, k, root) {
  const id = shell.dataset.part, sx = e.clientX, sy = e.clientY, pid = e.pointerId;
  let o = null, x = 0, y = 0;
  const move = (ev) => {
    if (!o) {
      if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < DRAG_PX) return;
      settling.get(k + "|" + id)?.stop();
      o = pos[k]?.[id] ?? { x: 0, y: 0 };
      shell.setPointerCapture(pid); shell.classList.add("drag"); root.host.classList.add("dragging");
      getSelection().removeAllRanges(); closeMenu(root);
      begin(["L" + k], shell.dataset.name + " 挪位", { type: "move", k, id });
    }
    ev.preventDefault();
    x = o.x + (ev.clientX - sx) / zoom; y = o.y + (ev.clientY - sy) / zoom;
    setPos(k, id, x, y);
  };
  const up = (ev) => {
    removeEventListener("pointermove", move, true); removeEventListener("pointerup", up, true); removeEventListener("pointercancel", up, true);
    if (!o) return;
    swallow = true; setTimeout(() => (swallow = false), 0);
    shell.classList.remove("drag"); root.host.classList.remove("dragging");
    const snap = (n) => Math.round(ev.shiftKey ? n : Math.round(n / SNAP) * SNAP);
    const to = { x: snap(x), y: snap(y) };
    save("L" + k, putL(load("L" + k, {}), id, to)); commit();   // 落点先记下（撤回认它），弹簧只管画过去
    settle(k, id, to);
  };
  addEventListener("pointermove", move, true); addEventListener("pointerup", up, true); addEventListener("pointercancel", up, true);
}

/* 右下角拉手改大小：从当前尺寸起，按 8px 吸（Shift 不吸），松手记一条 */
function armResize(e, grip, k, root) {
  e.preventDefault(); e.stopPropagation();
  const shell = grip.parentElement, id = shell.dataset.part, r0 = shell.getBoundingClientRect();
  const w0 = r0.width / zoom, h0 = r0.height / zoom, sx = e.clientX, sy = e.clientY;
  let w = w0, h = h0;
  begin(["L" + k], shell.dataset.name + " 调大小", { type: "size", k, id });
  grip.setPointerCapture(e.pointerId); shell.classList.add("drag"); root.host.classList.add("dragging"); closeMenu(root);
  const move = (ev) => {
    const snap = (n) => Math.max(16, Math.round(ev.shiftKey ? n : Math.round(n / SNAP) * SNAP));
    w = snap(w0 + (ev.clientX - sx) / zoom); h = snap(h0 + (ev.clientY - sy) / zoom);
    setSize(k, id, w, h);
  };
  const up = () => {
    grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up); grip.removeEventListener("pointercancel", up);
    swallow = true; setTimeout(() => (swallow = false), 0);
    shell.classList.remove("drag"); root.host.classList.remove("dragging");
    save("L" + k, putL(load("L" + k, {}), id, { w, h })); commit();
  };
  grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up); grip.addEventListener("pointercancel", up);
}

/* ---- 锚定层（影子里） ---- */
function closeMenu(root) {
  const m = root.querySelector(".menu:not(.closing)");

  m.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(-4px) scale(.98)" }], { duration: 120, easing: "ease-in" }).finished.then(() => m.remove());
}
function openMenu(root, btn) {
  const face = root.querySelector(".root");

  m.className = "menu";
  m.innerHTML = (R().menu?.(S(), btn) ?? []).map((x) => `<button data-act="${x.label}" class="${x.danger ? "danger" : ""}">${x.label}</button>`).join("");
  face.appendChild(m);
  const z = zoom, fr = face.getBoundingClientRect(), br = btn.getBoundingClientRect();
  const f = { width: fr.width / z, height: fr.height / z }, r = { right: (br.right - fr.left) / z, top: (br.top - fr.top) / z, bottom: (br.bottom - fr.top) / z };
  m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, f.width - m.offsetWidth - 8)) + "px";
  const below = r.bottom + 6;
  m.style.top = (below + m.offsetHeight > f.height - 8 ? r.top - 6 - m.offsetHeight : below) + "px";

/* ---- 交互：影子里的事件，按看法分流 ---- */
function wire(root, k) {
  const s = S(), i = k.split(".")[1];
  root.addEventListener("click", (e) => {
    if (!flags.live) return;
    if (swallow) { swallow = false; e.stopPropagation(); return; }   // 刚拖完松手的那下不算点
    const b = e.target.closest("button");
    const open = root.querySelector(".menu:not(.closing)");
    if (b?.matches("[data-menu]")) return open ? closeMenu(root) : openMenu(root, b);
    if (open) closeMenu(root);
    const act = b?.dataset.act;
    if (act === undefined) return;
    R().on?.(act, { root, spec: s, btn: b, log: (text) => logAct(i, text) });
    logAct(i, act, b.classList.contains("danger"));
  });
  root.addEventListener("pointerdown", (e) => {
    const g = flags.build && e.button === 0 && e.target.closest(".sz");
    if (g) return armResize(e, g, k, root);
    const sh = flags.build && e.button === 0 && !e.target.closest("[contenteditable], .menu") && e.target.closest(".shell");
    if (sh) armDrag(e, sh, k, root);
  });
  root.addEventListener("dblclick", (e) => {
    const sh = flags.build && !e.target.closest("button") && e.target.closest(".shell");
    if (!sh) return;
    const L = load("L" + k, {}), id = sh.dataset.part;
    if (!L[id]) return;
    txn(["L" + k], sh.dataset.name + " 归位", () => { delete L[id]; save("L" + k, L); }, { type: "move", k, id });   // 位置与大小一起回原样
    settle(k, id, { x: 0, y: 0 }); setSize(k, id, null, null);
  });
}

/* 弹层：一次只开一个；点外面 / Esc 收起 */

/* 换样本 / 轮次 / 钉住：旧的淡出、新的逐格入场（不许突然出现） */
let gen = 0;
async function render() {

  for (const a of settling.values()) a.stop();
  if (stage.childElementCount) {
    const a = stage.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: "ease-in", fill: "forwards" });
    await a.finished;
    if (g !== gen) return;

  } else paint();
}
/* 选档：单看 / 对照时格要换（淡出再入场）；平铺时只换焦点，格不重画，滑条栏的私有参数、形状图跟过去 */
function setV(i) {

  if (view !== "all") return render();
  renderKnobs(); syncChrome();
  if (openPop === "histPop") renderFig();
}
const setSpec = (i) => { spec = i; save("s", i); render(); };

/* M：两开 → 只交互 → 只拼装 → 静态 → 两开 */
const CYCLE = [[true, true], [true, false], [false, true], [false, false]];

function toggleDock() { closePop(); document.body.classList.toggle("dock-off"); save("do", document.body.classList.contains("dock-off")); }

addEventListener("keydown", (e) => {
  /* ⌘Z / Ctrl+Z 撤回，⇧⌘Z / Ctrl+Y 重做；正在改名（contenteditable）时让给原生撤回 */
  const zk = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && !e.altKey && (zk === "z" || zk === "y") && !e.composedPath()[0].matches?.("[contenteditable]")) {

  }
  if (e.metaKey || e.ctrlKey || e.altKey || e.composedPath()[0].matches?.("input, textarea, [contenteditable]")) return;
  if (/^[0-9]$/.test(e.key) && Number(e.key) < R().list.length) return setV(Number(e.key));
  const k = e.key.toLowerCase();
  if (k === "s") return setSpec((spec + 1) % SPECS.length);
  if (k === "c") return setView(view === "pair" ? "one" : "pair");
  if (k === "a") return setView(view === "all" ? "one" : "all");
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { const n = R().list.length; return setV((sel[round] + (e.key === "ArrowRight" ? 1 : n - 1)) % n); }
  if (k === "m") { const i = CYCLE.findIndex(([a, b]) => a === flags.live && b === flags.build); return setFlags(...CYCLE[(i + 1) % CYCLE.length]); }
  if (k === "r" && ROUNDS.length > 1) return setRound((round + 1) % ROUNDS.length);
  if (k === "t") return setTheme({ auto: "light", light: "dark", dark: "auto" }[themePref]);   // 系统 → 亮 → 暗 → 系统

});

if (!SPECS.length || !ROUNDS.length || ROUNDS.some((r) => !r.tile || !r.list?.length)) {
  stage.innerHTML = `<div class="lab-empty"><b>对照版还没填</b>：脚本第 ② 段的 SPECS（≥3 条样本）与 ROUNDS（每轮要有 tile 与 list）是空的。写法见 morii-compare 的 SKILL.md ④。</div>`;
  throw new Error("对照版：SPECS / ROUNDS 未填（或某轮缺 tile / list）");
}
renderChrome(); renderHist(); render();
